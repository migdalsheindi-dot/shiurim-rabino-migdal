    // ---------------------------------------------------------------------
    // Utilidades

    function formatFecha(fechaStr) {
      const d = new Date(fechaStr + "T00:00:00");
      return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
    }

    function formatTiempo(seg) {
      if (!seg || isNaN(seg)) return "0:00";
      const m = Math.floor(seg / 60);
      const s = Math.floor(seg % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    const SPEEDS = [1, 1.25, 1.5, 2];

    // Un shiur "válido" para mostrar necesita, como mínimo, título y audio.
    // Filtra silenciosamente cualquier entrada rota (por ejemplo, si data.json
    // se editó a mano y quedó algún objeto incompleto) en vez de romper toda la web.
    function esShiurValido(s) {
      return !!(s && typeof s === "object" && s.titulo && s.audioUrl);
    }

    // El título que se muestra en la web es siempre, exactamente, el título
    // del episodio en Spotify for Creators (shiur.titulo) — ya no existe un
    // "título principal" cargado a mano aparte, así nunca se desincroniza de
    // lo que se ve en Spotify.
    function tituloPrincipalDe(shiur) {
      return shiur.titulo;
    }

    // La descripción que se escribe en Spotify for Creators se separa en dos
    // partes con un salto de línea: la primera línea es el "subtítulo" (una
    // bajada corta), el resto es la descripción completa. Si no hay salto de
    // línea (el caso de casi todos los shiurim ya cargados, con una sola
    // frase de descripción), se sigue mostrando todo como descripción, sin
    // subtítulo — no cambia nada de lo que ya se veía.
    function separarDescripcion(descripcionCompleta) {
      const texto = (descripcionCompleta || "").trim();
      const salto = texto.indexOf("\n");
      if (salto === -1) return { subtitulo: "", descripcion: texto };
      return { subtitulo: texto.slice(0, salto).trim(), descripcion: texto.slice(salto + 1).trim() };
    }

    // ---------------------------------------------------------------------
    // Importación de episodios desde un feed RSS (Spotify for Creators / Anchor
    // y, en general, cualquier feed de podcast estándar): lectura del feed,
    // categorización automática por palabras clave, e importación de
    // transcripciones reales cuando el feed las publica (etiqueta estándar
    // <podcast:transcript>, la que usa Spotify for Creators).
    // ---------------------------------------------------------------------
    function textoDe(nodo, tag) {
      const el = nodo.getElementsByTagName(tag)[0];
      return el ? el.textContent : "";
    }
    function atributoDe(nodo, tag, attr) {
      const el = nodo.getElementsByTagName(tag)[0];
      return el ? el.getAttribute(attr) : "";
    }

    async function fetchTextUrl(url) {
      // 1) Intento directo: algunas URLs sí permiten leerse desde el navegador.
      try {
        const directa = await fetch(url);
        if (directa.ok) {
          const texto = await directa.text();
          if (texto && texto.trim().length > 0) return texto;
        }
      } catch (e) {
        // Sigue con el proxy de abajo.
      }
      // 2) La gran mayoría de los feeds de Spotify for Creators / Anchor (y los
      //    archivos de transcripción que enlazan) no permiten que un navegador
      //    los lea de forma directa (por política de CORS del propio servidor,
      //    no del código de esta web). Se usa un proxy público de solo lectura
      //    como puente, sin necesidad de credenciales ni de un backend propio.
      const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
      const viaProxy = await fetch(proxy);
      if (!viaProxy.ok) throw new Error("No se pudo acceder a " + url);
      return await viaProxy.text();
    }

    // --- Categorización automática por palabras clave en título/descripción ---
    // Quita tildes/diacríticos (á -> a, é -> e, etc.): normaliza el texto y
    // descarta los caracteres de combinación Unicode (rango U+0300–U+036F,
    // los que quedan "sueltos" arriba de cada letra tras normalizar con NFD).
    const CARACTERES_DIACRITICOS = new RegExp("[̀-ͯ]", "g");
    function quitarAcentos(s) {
      return (s || "").normalize("NFD").replace(CARACTERES_DIACRITICOS, "").toLowerCase();
    }

    const REGLAS_CATEGORIA = [
      { categoria: "Tania", palabras: ["tania"] },
      { categoria: "Pirkei Avot", palabras: ["pirkei avot", "pirke avot", "avot"] },
      {
        categoria: "Historias Jasídicas",

    function detectarCategoria(titulo, descripcion) {
      const texto = quitarAcentos(`${titulo} ${descripcion}`);
      for (const regla of REGLAS_CATEGORIA) {
        if (regla.palabras.some((p) => texto.indexOf(quitarAcentos(p)) !== -1)) {
          return regla.categoria;
        }
      }
      return CATEGORIA_POR_DEFECTO;
    }

    // --- Transcripciones reales publicadas en el feed (podcast:transcript) ---
    function vttOSrtATexto(contenido) {
      return contenido
        .split(/\r?\n/)
        .filter((linea) => {
          const l = linea.trim();
          if (!l) return false;
          if (l === "WEBVTT") return false;
          if (/^NOTE/i.test(l)) return false;
          if (/^\d+$/.test(l)) return false; // números de cue (SRT)
          if (/-->/.test(l)) return false; // línea de tiempos
          return true;
        })
        .join(" ")
        .replace(/<[^>]+>/g, "") // por si trae etiquetas de estilo VTT
        .replace(/\s+/g, " ")
        .trim();
    }

    function jsonTranscriptATexto(jsonText) {
      try {
        const data = JSON.parse(jsonText);
        const segmentos = data.segments || data.results || (Array.isArray(data) ? data : null);
        if (Array.isArray(segmentos)) {
          return segmentos
            .map((seg) => seg.body || seg.text || seg.transcript || (seg.alternatives && seg.alternatives[0] && seg.alternatives[0].transcript) || "")
            .filter(Boolean)
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();
        }
      } catch (e) {}
      return "";
    }

    function elegirMejorTranscriptTag(tags) {
      const prioridad = ["text/plain", "text/vtt", "application/srt", "application/x-subrip", "application/json", "text/html"];
      let mejor = null;
      let mejorRank = Infinity;
      tags.forEach((tag) => {
        const tipo = (tag.getAttribute("type") || "").toLowerCase();
        const rank = prioridad.indexOf(tipo);
        const rankFinal = rank === -1 ? prioridad.length : rank;
        if (rankFinal < mejorRank) { mejorRank = rankFinal; mejor = tag; }
      });
      return mejor;
    }

    async function obtenerTranscripcionDeItem(item) {
      const tags = Array.prototype.slice.call(item.getElementsByTagName("podcast:transcript"));
      if (tags.length === 0) return ""; // el feed no publica transcripciones para este episodio
      const elegido = elegirMejorTranscriptTag(tags);
      const url = elegido && elegido.getAttribute("url");
      if (!url) return "";
      const tipo = (elegido.getAttribute("type") || "").toLowerCase();
      try {
        const contenido = await fetchTextUrl(url);
        if (tipo.indexOf("json") !== -1) return jsonTranscriptATexto(contenido);
        if (tipo.indexOf("vtt") !== -1 || tipo.indexOf("srt") !== -1 || tipo.indexOf("subrip") !== -1) return vttOSrtATexto(contenido);
        if (tipo.indexOf("html") !== -1) return new DOMParser().parseFromString(contenido, "text/html").body.textContent.trim();
        return contenido.trim(); // text/plain u otro formato de texto simple
      } catch (e) {
        return "";
      }
    }

    // Procesa las transcripciones de a varios episodios en paralelo (no de a
    // uno) para que sincronizar un podcast con muchos episodios no tarde
    // demasiado, e informa el progreso mientras tanto.
    async function enriquecerConTranscripciones(episodios, onProgreso) {
      const CONCURRENCIA = 4;
      let indice = 0;
      let completados = 0;
      async function trabajador() {
        while (indice < episodios.length) {
          const i = indice++;
          const ep = episodios[i];
          try {
            ep.transcripcion = await obtenerTranscripcionDeItem(ep._item);
          } catch (e) {
            ep.transcripcion = "";
          }
          delete ep._item;
          completados++;
          if (onProgreso) onProgreso(completados, episodios.length);
        }
      }
      const trabajadores = [];
      for (let i = 0; i < CONCURRENCIA; i++) trabajadores.push(trabajador());
      await Promise.all(trabajadores);
      return episodios;
    }

    function parsearFeedRSS(xmlText) {
      const xml = new DOMParser().parseFromString(xmlText, "text/xml");
      if (xml.getElementsByTagName("parsererror").length) {
        throw new Error("El feed no tiene un formato XML válido.");
      }
      const channel = xml.getElementsByTagName("channel")[0];
      const imagenCanal = channel
        ? (textoDe(channel, "url") || atributoDe(channel, "itunes:image", "href") || "")
        : "";
      const items = Array.prototype.slice.call(xml.getElementsByTagName("item"));
      return items
        .map((item) => {
          const titulo = (textoDe(item, "title") || "Episodio sin título").trim();
          const audioUrl = atributoDe(item, "enclosure", "url") || "";
          const portadaUrl = atributoDe(item, "itunes:image", "href") || imagenCanal || "";
          const pubDateRaw = textoDe(item, "pubDate");
          const fechaObj = pubDateRaw ? new Date(pubDateRaw) : null;
          const fecha = fechaObj && !isNaN(fechaObj.getTime()) ? fechaObj.toISOString().slice(0, 10) : "";
          const descRaw = textoDe(item, "description") || textoDe(item, "itunes:summary") || "";
          const descripcion = new DOMParser().parseFromString(descRaw, "text/html").body.textContent.trim();
          const categoria = detectarCategoria(titulo, descripcion);
          return { titulo, categoria, audioUrl, portadaUrl, fecha, descripcion, _item: item };
        })
        .filter((ep) => ep.audioUrl); // se descartan entradas sin audio (no son episodios reproducibles)
    }

    // ---------------------------------------------------------------------
    // Vista detallada (modal de pantalla completa) — incluye transcripción
    // sincronizada con el tiempo real de reproducción del audio (no usa
    // micrófono ni reconocimiento de voz).
    // ---------------------------------------------------------------------
    function ShiurDetailModal({ shiur, onClose, isActive, isPlaying, speed, progreso, actual, duracion, onPlayToggle, onSeek, onSpeedChange }) {
      const [mostrarTranscripcion, setMostrarTranscripcion] = useState(false);
      // null = todavía no se intentó cargar; [] = se intentó y no hay tiempos
      // reales para este shiur (shiurim viejos aún no procesados); array con
      // datos = tiempos reales por palabra, listos para usar.
      const [tiempos, setTiempos] = useState(null);
      const cajaTextoRef = useRef(null);
      const marcaActualRef = useRef(null);

      const titulo = tituloPrincipalDe(shiur);
      const { subtitulo, descripcion } = separarDescripcion(shiur.descripcion);

      const tieneTranscripcion = !!(shiur.transcripcion && shiur.transcripcion.trim());
      const palabrasPlano = useMemo(
        () => (tieneTranscripcion ? shiur.transcripcion.trim().split(/\s+/) : []),
        [shiur.transcripcion]
      );

      // Carga bajo demanda (solo al abrir la transcripción, una vez por
      // shiur) los tiempos reales por palabra generados por Whisper. Es un
      // archivo aparte de data.json porque puede pesar varios cientos de KB
      // por shiur — cargarlo para los 200+ shiurim en cada visita haría la
      // web lenta. Si el archivo no existe todavía (shiurim a los que
      // todavía no les tocó transcribirse con tiempos), sigue funcionando
      // con la estimación proporcional de siempre como respaldo.
      useEffect(() => {
        if (!mostrarTranscripcion || !tieneTranscripcion) return;
        let cancelado = false;
        setTiempos(null);
        fetch(`./transcripts/${shiur.id}.json`, { cache: "force-cache" })
          .then((r) => (r.ok ? r.json() : null))
          .then((data) => {
            if (!cancelado) setTiempos(data && Array.isArray(data.palabras) ? data.palabras : []);
          })
          .catch(() => { if (!cancelado) setTiempos([]); });
        return () => { cancelado = true; };
      }, [mostrarTranscripcion, tieneTranscripcion, shiur.id]);

      const tieneTiempos = Array.isArray(tiempos) && tiempos.length > 0;
      // Cuando hay tiempos reales, el texto que se muestra sale de ahí mismo
      // (misma fuente que los tiempos), así el resaltado nunca se desalinea
      // por una tokenización distinta a la del texto plano.
      const palabras = tieneTiempos ? tiempos.map((t) => t.w) : palabrasPlano;

      // Palabra actual: con tiempos reales, se busca por búsqueda binaria la
      // última palabra cuyo inicio ya pasó — funciona igual en cualquier
      // velocidad de reproducción, después de pausar, o al saltar hacia
      // adelante/atrás, porque currentTime del audio siempre refleja la
      // posición real (el navegador ya se encarga de eso). Sin tiempos
      // todavía, se usa la estimación proporcional anterior.
      const cantidadVisible = useMemo(() => {
        if (!isActive) return 0;
        if (tieneTiempos) {
          let lo = 0, hi = tiempos.length - 1, resultado = 0;
          while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (tiempos[mid].s <= actual) { resultado = mid + 1; lo = mid + 1; }
            else hi = mid - 1;
          }
          return resultado;
        }
        const progresoTexto = duracion > 0 ? Math.min(1, Math.max(0, actual / duracion)) : 0;
        return Math.round(palabrasPlano.length * progresoTexto);
      }, [isActive, tieneTiempos, tiempos, actual, duracion, palabrasPlano.length]);

      useEffect(() => {
        if (mostrarTranscripcion && marcaActualRef.current && typeof marcaActualRef.current.scrollIntoView === "function") {
          marcaActualRef.current.scrollIntoView({ block: "center" });
        }
      }, [cantidadVisible, mostrarTranscripcion]);

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center" onClick={onClose}>
          <div
            className="bg-white w-full sm:max-w-2xl sm:rounded-lg rounded-t-2xl max-h-[95vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
          >
            {shiur.portadaUrl ? (
              <div className="w-full h-52 sm:h-72 bg-stone-100 flex items-center justify-center overflow-hidden">
                <img src={shiur.portadaUrl} alt={titulo} className="w-full h-full object-contain" loading="lazy" decoding="async" />
              </div>
            ) : (
              <div className="w-full h-16 bg-stone-100" />
            )}

            <div className="p-5 sm:p-8 relative">
              <button
                onClick={onClose}
                className="absolute top-4 right-4 w-9 h-9 flex items-center justify-center text-stone-400 hover:text-stone-700"
                aria-label="Cerrar"
              >
                <IconX size={20} />
              </button>

              <span
                className="inline-block text-[11px] tracking-wide uppercase px-2 py-1 rounded mb-3"
                style={{ color: colorDeCategoria(shiur.categoria).texto, backgroundColor: colorDeCategoria(shiur.categoria).fondo }}
              >
                {shiur.categoria}
              </span>
              <h2 className="font-serif text-2xl text-stone-900 mb-1 pr-8 leading-snug">{titulo}</h2>
              {subtitulo && <p className="text-stone-500 text-sm italic mb-1">{subtitulo}</p>}
              <p className="text-stone-500 text-sm mb-3">{formatFecha(shiur.fecha)}</p>
              {descripcion && <p className="text-stone-700 text-sm leading-relaxed whitespace-pre-line mb-5">{descripcion}</p>}

              {/* Reproductor embebido */}
              <div className="bg-stone-50 border border-stone-200 rounded-lg p-4 mb-4">
                <div className="flex items-center gap-3 mb-3">
                  <button
                    onClick={onPlayToggle}
                    className="shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-stone-900 text-white active:scale-95 transition-transform"
                    aria-label={isActive && isPlaying ? "Pausar" : "Reproducir"}
                  >
                    {isActive && isPlaying ? <IconPause size={20} /> : <IconPlay size={20} />}
                  </button>
                  <div className="flex-1 min-w-0 flex items-center gap-2">
                    <span className="text-[10px] text-stone-400 w-8 text-right shrink-0">{formatTiempo(isActive ? actual : 0)}</span>
                    <input
                      type="range"
                      min={0}
                      max={100}
                      step={0.1}
                      value={isActive && !isNaN(progreso) ? progreso : 0}
                      onChange={(e) => onSeek(Number(e.target.value))}
                      className="w-full accent-stone-900 h-3 sm:h-1.5 cursor-pointer"
                    />
                    <span className="text-[10px] text-stone-400 w-8 shrink-0">{formatTiempo(isActive ? duracion : 0)}</span>
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-[11px] text-stone-500 mr-1">Velocidad:</span>
                  {SPEEDS.map((s) => (
                    <button
                      key={s}
                      onClick={() => onSpeedChange(s)}
                      className={`text-xs px-2.5 py-1.5 rounded border transition-colors ${
                        speed === s ? "bg-stone-900 text-white border-stone-900" : "border-stone-300 text-stone-600 hover:border-stone-500"
                      }`}
                    >
                      {s}x
                    </button>
                  ))}
                </div>
              </div>

              {/* Transcripción sincronizada con el audio del shiur */}
              <div className="mb-6">
                <button
                  onClick={() => setMostrarTranscripcion((v) => !v)}
                  className={`w-full text-sm font-medium px-4 py-3 rounded border transition-colors ${
                    mostrarTranscripcion ? "bg-stone-900 text-white border-stone-900" : "border-stone-300 text-stone-700 hover:bg-stone-50"
                  }`}
                >
                  Transcripción
                </button>

                {mostrarTranscripcion && !tieneTranscripcion && (
                  <p className="text-xs text-stone-400 mt-2 text-center">Todavía no hay transcripción cargada para este shiur.</p>
                )}

                {mostrarTranscripcion && tieneTranscripcion && (
                  <React.Fragment>
                    {!isActive && (
                      <p className="text-xs text-stone-400 mt-2 text-center">Reproducí el audio para que el texto avance solo.</p>
                    )}
                    <div
                      ref={cajaTextoRef}
                      className="mt-3 bg-stone-50 border border-stone-200 rounded-lg p-4 text-sm leading-relaxed max-h-48 overflow-y-auto"
                    >
                      {palabras.map((palabra, i) => (
                        <span
                          key={i}
                          ref={i === cantidadVisible - 1 ? marcaActualRef : null}
                          className={i < cantidadVisible ? "text-stone-900" : "text-stone-300"}
                        >
                          {palabra}{" "}
                        </span>
                      ))}
                    </div>
                  </React.Fragment>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // Reproductor flotante (barra inferior, con audio real)

    function FloatingPlayer({ current, isPlaying, speed, progreso, actual, duracion, onTogglePlay, onSeek, onSpeedChange, onClose, onOpenDetail }) {
      if (!current) return null;

      const cycleSpeed = () => {
        const idx = SPEEDS.indexOf(speed);
        onSpeedChange(SPEEDS[(idx + 1) % SPEEDS.length]);
      };

      return (
        <div
          className="fixed bottom-0 inset-x-0 bg-stone-900 text-stone-50 border-t border-stone-700 z-40"
          style={{ paddingBottom: "env(safe-area-inset-bottom)" }}

              <div className="flex items-center gap-2 mt-1.5">

                <input
                  type="range"
                  min={0}
                  max={100}
                  step={0.1}
                  value={isNaN(progreso) ? 0 : progreso}
                  onClick={(e) => e.stopPropagation()}
                  onChange={(e) => onSeek(Number(e.target.value))}
                  className="w-full accent-white h-3 sm:h-1 cursor-pointer"
                />
                <span className="text-[10px] text-stone-400 w-8 shrink-0">{formatTiempo(duracion)}</span>

              aria-label="Cerrar reproductor"
            >
              <IconX size={18} />
            </button>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    function ContactModal({ onClose, adminEmail }) {
      const [form, setForm] = useState({ nombre: "", apellido: "", email: "", mensaje: "" });

      const update = (field) => (e) => setForm((f) => ({ ...f, [field]: e.target.value }));

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!EMAILJS_CONFIGURADO) { setEstado("no-config"); return; }
        setEstado("enviando");
        try {
          await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            from_name: `${form.nombre} ${form.apellido}`.trim(),
            reply_to: form.email,
            message: form.mensaje,
            to_email: adminEmail || "",
          });
          setEstado("ok");
          setForm({ nombre: "", apellido: "", email: "", mensaje: "" });
        } catch (err) {
          console.error(err);
          setEstado("error");
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">

                    value={form.nombre}
                    onChange={update("nombre")}

                  required

                  onChange={update("email")}

                  className="w-full border border-stone-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-blue-900"
                />
                <textarea
                  required
                  rows={4}

                  onChange={update("mensaje")}

                  className="w-full border border-stone-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-blue-900 resize-none"
                />

                {estado === "no-config" && (

                  className="w-full bg-stone-900 text-white text-sm font-medium py-3 rounded hover:bg-stone-800 disabled:opacity-60"
                >

                onChange={(e) => { setPassword(e.target.value); setError(false); }}

                  error ? "border-red-400" : "border-stone-300 focus:border-blue-900"
                }`}
                placeholder="Contraseña"
              />
              {error && <p className="text-xs text-red-500 mb-3">Contraseña incorrecta.</p>}
              <div className="flex gap-2 mt-4">
                <button type="button" onClick={onCancel} className="flex-1 text-sm border border-stone-300 rounded py-2.5 text-stone-600 hover:bg-stone-50">
                  Cancelar
                </button>
                <button type="submit" className="flex-1 text-sm bg-stone-900 text-white rounded py-2.5 hover:bg-stone-800">
                  Ingresar
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // Panel Admin (crear / editar / eliminar + publicar data.json)
    // ---------------------------------------------------------------------
    const EMPTY_FORM = {
      titulo: "",
      categoria: CATEGORIAS[0],
      fecha: "",
      audioUrl: "",
      portadaUrl: "",
      descripcion: "",
      transcripcion: "",
      reproducciones: 0,

    function AdminPanel({ shiurim, editingShiur, onSave, onEdit, onDelete, onClose, onLogout, onCancelEdit, config, onConfigChange, onExportBackup, onImportBackup, onSyncRss, errorCargaDatos }) {
      const [form, setForm] = useState(editingShiur ? { ...EMPTY_FORM, ...editingShiur } : EMPTY_FORM);
      const [sincronizandoRss, setSincronizandoRss] = useState(false);
      const [mensajeRss, setMensajeRss] = useState(null); // { tipo: "ok" | "error" | "info", texto }

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            onImportBackup(data);
          } catch (err) {
            alert("No se pudo leer el archivo. Asegúrate de que sea un backup (data.json) válido.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      const handleSincronizarRss = async () => {
        const url = (config.rssFeedUrl || "").trim();
        if (!url) { setMensajeRss({ tipo: "error", texto: "Pegá primero el link de tu feed RSS." }); return; }
        setSincronizandoRss(true);
        setMensajeRss({ tipo: "info", texto: "Leyendo el feed..." });
        try {
          const xml = await fetchTextUrl(url);
          const episodios = parsearFeedRSS(xml);
          if (episodios.length === 0) {
            setMensajeRss({ tipo: "error", texto: "El feed se leyó bien pero no se encontraron episodios con audio." });
          } else {
            setMensajeRss({ tipo: "info", texto: `Encontrados ${episodios.length} episodios. Buscando transcripciones publicadas en el feed...` });
            await enriquecerConTranscripciones(episodios, (hechos, total) => {
              setMensajeRss({ tipo: "info", texto: `Procesando transcripciones: ${hechos}/${total}...` });
            });
            const { agregados, actualizados, conTranscripcion } = onSyncRss(episodios);
            setMensajeRss({
              tipo: "ok",
              texto: `Listo: se importaron ${episodios.length} episodios del feed (${agregados} nuevo(s), ${actualizados} actualizado(s)). ${conTranscripcion} quedaron con transcripción real importada. No te olvides de "Exportar Backup" para publicarlo.`,
            });
          }
        } catch (err) {
          console.error(err);
          setMensajeRss({ tipo: "error", texto: "No se pudo leer el feed. Revisá que el link sea correcto e intentá de nuevo." });
        } finally {
          setSincronizandoRss(false);
        }
      };

      const totalReproducciones = useMemo(
        () => shiurim.reduce((acc, s) => acc + (Number(s.reproducciones) || 0), 0),
        [shiurim]
      );
      const topShiurim = useMemo(
        () => [...shiurim].sort((a, b) => (Number(b.reproducciones) || 0) - (Number(a.reproducciones) || 0)).slice(0, 5),

      const maxReproducciones = topShiurim.length ? (Number(topShiurim[0].reproducciones) || 0) : 0;

    // ---------------------------------------------------------------------
    // Componente principal
    // ---------------------------------------------------------------------
    function ShiurimApp() {
      const [shiurim, setShiurim] = useState([]);
      const [cargando, setCargando] = useState(true);
      const [config, setConfig] = useState(CONFIG_DEFECTO);
      const [errorCargaDatos, setErrorCargaDatos] = useState(false);

      // Carga inicial: data.json del servidor es SIEMPRE la fuente de verdad
      // pública. Se pide con un parámetro de versión (cache-buster) y
      // "cache: no-store" para que ni el navegador ni la CDN del hosting
      // devuelvan una copia vieja guardada en caché — todos los visitantes
      // (cualquier navegador, modo incógnito, otro dispositivo) ven siempre
      // el archivo real y actual. localStorage NUNCA pisa una lectura
      // exitosa de data.json: solo se usa como respaldo si data.json no se
      // pudo leer (sin conexión, archivo roto o ausente).
      useEffect(() => {
        let cancelado = false;
        const url = `./data.json?v=${Date.now()}`;

        fetch(url, { cache: "no-store" })
          .then((r) => {
            if (!r.ok) throw new Error("data.json respondió HTTP " + r.status);
            return r.json();
          })
          .then((data) => {
            if (cancelado) return;
            if (!data || !Array.isArray(data.shiurim)) {
              throw new Error("data.json no tiene el formato esperado (falta el array 'shiurim').");
            }
            const shiurimValidos = data.shiurim.filter(esShiurValido);
            const configFinal = { ...CONFIG_DEFECTO, ...(data.config || {}) };
            setShiurim(shiurimValidos);
            setConfig(configFinal);
            setErrorCargaDatos(false);
            // Se guarda como respaldo (no como prioridad) para el caso de que,
            // en una próxima visita, no haya conexión o data.json esté caído.
            try { localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify({ config: configFinal, shiurim: shiurimValidos })); } catch (e) {}
          })
          .catch((err) => {
            console.error("No se pudo cargar data.json:", err);
            if (cancelado) return;
            let datosLocales = null;
            try {
              const guardado = localStorage.getItem(STORAGE_KEY_DATA);
              if (guardado) datosLocales = JSON.parse(guardado);
            } catch (e) {}
            if (datosLocales && Array.isArray(datosLocales.shiurim)) {
              setShiurim(datosLocales.shiurim);
              setConfig({ ...CONFIG_DEFECTO, ...(datosLocales.config || {}) });
            } else {
              setShiurim(MOCK_SHIURIM);
              setConfig(CONFIG_DEFECTO);
            }
            setErrorCargaDatos(true);
          })
          .finally(() => { if (!cancelado) setCargando(false); });

        return () => { cancelado = true; };
      }, []);

      // Mientras editás en el Panel Admin (o sincronizás RSS) DENTRO de esta
      // misma sesión, se guarda una copia de respaldo en este navegador a cada
      // cambio. Esto es solo una red de seguridad para no perder trabajo si la
      // pestaña se cierra sin querer antes de exportar — en la PRÓXIMA carga de
      // la página, data.json (del servidor) sigue siendo lo que se muestra.
      useEffect(() => {
        if (cargando) return;
        try {
          localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify({ config, shiurim }));
        } catch (e) {
          // localStorage lleno o no disponible (ej. modo privado): la app sigue
          // funcionando igual, solo que sin este respaldo automático extra.
        }
      }, [shiurim, config, cargando]);

      // Registro del Service Worker (necesario para que el navegador considere
      // la web instalable como PWA, y para que funcione offline). Se usa
      // updateViaCache: "none" para que el propio navegador NUNCA sirva una
      // copia en caché del archivo service-worker.js: así, apenas hay una
      // versión nueva publicada en el hosting, el navegador la detecta de
      // inmediato en la próxima visita en vez de tardar horas en notarlo.
      useEffect(() => {
        if (!("serviceWorker" in navigator) || !navigator.serviceWorker) return;

        navigator.serviceWorker
          .register("./service-worker.js", { updateViaCache: "none" })
          .then((registro) => {
            // Pide de una vez, al cargar la página, que se fije si hay una
            // versión nueva del Service Worker (no espera al chequeo periódico
            // automático del navegador).
            registro.update().catch(() => {});
          })
          .catch((e) => {
            console.error("No se pudo registrar el service worker:", e);
          });

        // Cuando el Service Worker nuevo termina de tomar el control de la
        // página (gracias a skipWaiting + clients.claim en service-worker.js),
        // se recarga la página UNA sola vez de forma automática. Así, alguien
        // que ya tenía la pestaña abierta ve los shiurim nuevos sin tener que
        // cerrar y volver a abrir la web ni enterarse de que hubo un redeploy.
        let yaRecargo = false;
        const alCambiarControlador = () => {
          if (yaRecargo) return;
          yaRecargo = true;
          window.location.reload();
        };
        navigator.serviceWorker.addEventListener("controllerchange", alCambiarControlador);
        return () => navigator.serviceWorker.removeEventListener("controllerchange", alCambiarControlador);
      }, []);

      // Instalación como App (PWA). Chrome/Edge/Android avisan con el evento
      // "beforeinstallprompt" cuando la web cumple los requisitos para
      // instalarse; ahí se guarda ese evento para poder disparar el prompt
      // nativo del navegador al tocar el botón. Safari (iOS/Mac) no tiene este
      // evento: ahí se muestra un instructivo manual en su lugar.
      // Si ya se está corriendo instalada (abierta desde el ícono en la
      // pantalla de inicio), no hay nada que "instalar": display-mode
      // standalone cubre Android/Chrome/Edge, navigator.standalone es la
      // forma específica de Safari/iOS de indicar lo mismo.
      const yaEstaInstalada = () =>
        typeof window !== "undefined" &&
        (window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true);

      const [promptInstalacion, setPromptInstalacion] = useState(null);
      const [appInstalada, setAppInstalada] = useState(yaEstaInstalada);
      const [showInstallHelp, setShowInstallHelp] = useState(false);

      useEffect(() => {
        const alAntesDeInstalar = (e) => {
          e.preventDefault();
          setPromptInstalacion(e);
        };
        const alInstalar = () => {
          setAppInstalada(true);
          setPromptInstalacion(null);
        };
        window.addEventListener("beforeinstallprompt", alAntesDeInstalar);
        window.addEventListener("appinstalled", alInstalar);
        return () => {
          window.removeEventListener("beforeinstallprompt", alAntesDeInstalar);
          window.removeEventListener("appinstalled", alInstalar);
        };
      }, []);

      // Los iPad modernos (iPadOS 13+) se identifican con user-agent de
      // escritorio ("Macintosh"), sin "iPad" — la forma confiable de
      // distinguirlos de una Mac real es que sí tienen pantalla táctil.
      const esIOS =
        typeof navigator !== "undefined" &&
        (/iphone|ipad|ipod/i.test(navigator.userAgent || "") ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));

      const handleInstalarApp = async () => {
        if (promptInstalacion) {
          promptInstalacion.prompt();
          try { await promptInstalacion.userChoice; } catch (e) {}
          setPromptInstalacion(null);
        } else if (esIOS) {
          setShowInstallHelp(true);
        }
      };

      const mostrarBotonInstalar = !appInstalada && (promptInstalacion || esIOS);

      const [query, setQuery] = useState("");
      const [categoriaActiva, setCategoriaActiva] = useState("Todas");
      const [selectedShiur, setSelectedShiur] = useState(null);
      const [showContact, setShowContact] = useState(false);
      const [showDonate, setShowDonate] = useState(false);

      const [isAdmin, setIsAdmin] = useState(() => {
        try { return localStorage.getItem(STORAGE_KEY_AUTH) === "true"; } catch (e) { return false; }
      });
      const [showLogin, setShowLogin] = useState(false);
      const [adminOpen, setAdminOpen] = useState(false);
      const [editingShiur, setEditingShiur] = useState(null);

      // Audio global (compartido entre barra inferior y vista detalle)
      const audioRef = useRef(null);
      const [current, setCurrent] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(1);
      const [progreso, setProgreso] = useState(0);
      const [actual, setActual] = useState(0);
      const [duracion, setDuracion] = useState(0);

      // Acceso admin por URL: ?admin=true
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("admin") === "true" && !isAdmin) setShowLogin(true);
      }, []);

      // Atajo de teclado: Ctrl+Shift+A
      useEffect(() => {
        const handler = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) {
            if (!isAdmin) setShowLogin(true);
            else setAdminOpen(true);
          }
        };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [isAdmin]);

      // Play / pausa reales
      useEffect(() => {
        const audio = audioRef.current;
        if (!audio) return;
        if (isPlaying) audio.play().catch(() => {});
        else audio.pause();
      }, [isPlaying, current && current.id]);

      // Velocidad real
      useEffect(() => {
        if (audioRef.current) audioRef.current.playbackRate = speed;
      }, [speed, current && current.id]);

      // Reinicio al cambiar de shiur
      useEffect(() => {
        setProgreso(0);
        setActual(0);
        setDuracion(0);
      }, [current && current.id]);

      // Media Session API: controles desde pantalla de bloqueo / notificaciones del celular
      useEffect(() => {
        if (!("mediaSession" in navigator) || !current) return;
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: tituloPrincipalDe(current),
            artist: "Rabino Yoel Migdal",
            album: current.categoria,
            artwork: current.portadaUrl ? [{ src: current.portadaUrl, sizes: "512x512", type: "image/jpeg" }] : [],
          });
          navigator.mediaSession.setActionHandler("play", () => setIsPlaying(true));
          navigator.mediaSession.setActionHandler("pause", () => setIsPlaying(false));
          navigator.mediaSession.setActionHandler("seekbackward", (details) => {
            const audio = audioRef.current;
            if (audio) audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10));
          });
          navigator.mediaSession.setActionHandler("seekforward", (details) => {
            const audio = audioRef.current;
            if (audio) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (details.seekOffset || 10));
          });
        } catch (e) {}
        return () => {
          try {
            ["play", "pause", "seekbackward", "seekforward"].forEach((a) => navigator.mediaSession.setActionHandler(a, null));
          } catch (e) {}
        };
      }, [current && current.id]);

      useEffect(() => {
        if ("mediaSession" in navigator) {
          try { navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused"; } catch (e) {}
        }
      }, [isPlaying]);

      const handleTimeUpdate = () => {
        const audio = audioRef.current;
        if (!audio || !audio.duration) return;
        setActual(audio.currentTime);
        setProgreso((audio.currentTime / audio.duration) * 100);
      };
      const handleLoadedMetadata = () => { if (audioRef.current) setDuracion(audioRef.current.duration || 0); };
      const handleSeek = (valor) => {
        const audio = audioRef.current;
        setProgreso(valor);
        if (audio && audio.duration) audio.currentTime = (valor / 100) * audio.duration;
      };

      const handlePlay = (shiur) => {
        if (current && current.id === shiur.id) setIsPlaying((p) => !p);
        else { setCurrent(shiur); setIsPlaying(true); }
      };

      const RECIENTES_LIMITE = 6;
      const POPULARES_LIMITE = 6;
      const filtrados = useMemo(() => {
        const coincideTexto = (s) =>
          s.titulo.toLowerCase().includes(query.toLowerCase()) ||
          (s.descripcion || "").toLowerCase().includes(query.toLowerCase());

        if (categoriaActiva === "Populares") {
          const base = shiurim.filter(coincideTexto);
          return [...base].sort((a, b) => (Number(b.reproducciones) || 0) - (Number(a.reproducciones) || 0)).slice(0, POPULARES_LIMITE);
        }

        const base = shiurim.filter((s) => {
          const coincideCategoria = categoriaActiva === "Todas" || s.categoria === categoriaActiva;
          return coincideTexto(s) && coincideCategoria;
        });
        const ordenados = [...base].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        return categoriaActiva === "Todas" ? ordenados.slice(0, RECIENTES_LIMITE) : ordenados;
      }, [shiurim, query, categoriaActiva]);

      const handleLoginSuccess = () => {
        setIsAdmin(true);
        try { localStorage.setItem(STORAGE_KEY_AUTH, "true"); } catch (e) {}
        setShowLogin(false);
        setAdminOpen(true);
      };

      const handleLogout = () => {
        setIsAdmin(false);
        try { localStorage.removeItem(STORAGE_KEY_AUTH); } catch (e) {}
        setAdminOpen(false);
        setEditingShiur(null);
      };

      const handleSaveShiur = (data) => {
        if (editingShiur) {
          setShiurim((prev) => prev.map((s) => (s.id === editingShiur.id ? { ...data, id: editingShiur.id } : s)));
        } else {
          setShiurim((prev) => [{ ...data, id: Date.now() }, ...prev]);
        }
        setEditingShiur(null);
      };

      const handleDeleteShiur = (id) => {
        if (!window.confirm("¿Eliminar este shiur? Esta acción no se puede deshacer.")) return;
        setShiurim((prev) => prev.filter((s) => s.id !== id));
        if (current && current.id === id) { setCurrent(null); setIsPlaying(false); }
        if (selectedShiur && selectedShiur.id === id) setSelectedShiur(null);
      };

      const openEdit = (shiur) => { setEditingShiur(shiur); setAdminOpen(true); };

      const handleConfigChange = (field, value) => setConfig((c) => ({ ...c, [field]: value }));

      // Importa episodios ya parseados desde un feed RSS: agrega los que no
      // existen (por audioUrl, para nunca duplicar) y actualiza
      // título/portada/fecha/descripción de los que ya existen. La categoría y
      // el título principal (si lo cargaste a mano) NUNCA se pisan en un shiur
      // ya existente, y la transcripción solo se completa si todavía estaba
      // vacía. Las reproducciones cargadas a mano tampoco se tocan.
      const handleSyncRss = (episodios) => {
        const porAudio = new Map(shiurim.map((s) => [s.audioUrl, s]));
        let agregados = 0;
        let actualizados = 0;
        let conTranscripcion = 0;
        const resultado = [...shiurim];
        episodios.forEach((ep, idx) => {
          const existente = porAudio.get(ep.audioUrl);
          if (existente) {
            const i = resultado.findIndex((s) => s.id === existente.id);
            const yaTeniaTranscripcion = existente.transcripcion && existente.transcripcion.trim();
            const transcripcionFinal = yaTeniaTranscripcion ? existente.transcripcion : (ep.transcripcion || "");
            if (!yaTeniaTranscripcion && transcripcionFinal) conTranscripcion++;
            resultado[i] = {
              ...existente,
              titulo: ep.titulo || existente.titulo,
              portadaUrl: ep.portadaUrl || existente.portadaUrl,
              fecha: ep.fecha || existente.fecha,
              descripcion: ep.descripcion || existente.descripcion,
              transcripcion: transcripcionFinal,
            };
            actualizados++;
          } else {
            if (ep.transcripcion) conTranscripcion++;
            resultado.push({
              id: Date.now() + idx,
              titulo: ep.titulo,
              categoria: ep.categoria,
              fecha: ep.fecha,
              audioUrl: ep.audioUrl,
              portadaUrl: ep.portadaUrl,
              descripcion: ep.descripcion,
              transcripcion: ep.transcripcion || "",
              reproducciones: 0,
            });
            agregados++;
          }
        });
        setShiurim(resultado);
        return { agregados, actualizados, conTranscripcion };
      };

      // Backup único: junta shiurim + configuración en un solo archivo (data.json),
      // con EXACTAMENTE la misma forma que la carga inicial espera leer.
      const handleExportBackup = () => {
        const blob = new Blob([JSON.stringify({ config, shiurim }, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "data.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImportBackup = (data) => {
        if (!data || typeof data !== "object") { alert("El archivo no tiene un formato válido."); return; }
        if (Array.isArray(data.shiurim)) setShiurim(data.shiurim);
        else if (Array.isArray(data)) setShiurim(data); // compatibilidad con backups viejos (solo shiurim.json)
        if (data.config) setConfig({ ...CONFIG_DEFECTO, ...data.config });
      };

      return (
        <div className="min-h-screen bg-stone-50 pb-28 flex flex-col">
          {/* Encabezado */}
          <header className="border-b border-stone-200 bg-white safe-top">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
              <div className="flex items-start justify-between gap-4 mb-6">
                <div>
                  <h1 className="font-serif text-2xl md:text-3xl text-stone-900 tracking-tight">Rabino Yoel Migdal</h1>
                  <p className="font-serif italic text-stone-500 text-sm mt-1">Shiurim</p>
                </div>
                <div className="flex items-center gap-2 shrink-0 flex-wrap justify-end">
                  {mostrarBotonInstalar && (
                    <button
                      onClick={handleInstalarApp}
                      className="flex items-center gap-1.5 text-xs sm:text-sm text-stone-600 border border-stone-300 rounded-full px-3 py-2 hover:bg-stone-50 transition-colors"
                    >
                      <IconInstall size={14} />
                      <span className="hidden sm:inline">Instalar App</span>
                    </button>
                  )}
                  <button
                    onClick={() => setShowContact(true)}
                    className="flex items-center gap-1.5 text-xs sm:text-sm text-stone-600 border border-stone-300 rounded-full px-3 py-2 hover:bg-stone-50 transition-colors"
                  >
                    <IconMail size={14} />
                    <span className="hidden sm:inline">Contacto</span>
                  </button>
                  <button
                    onClick={() => setShowDonate(true)}
                    className="flex items-center gap-1.5 text-xs sm:text-sm font-medium text-blue-50 bg-blue-900 border border-blue-900 rounded-full px-4 py-2 hover:bg-stone-900 hover:border-stone-900 transition-colors duration-200"
                  >
                    Donar
                  </button>
                </div>
              </div>

              {/* Buscador y categorías, dentro del mismo encabezado */}
              <div className="relative mb-4">
                <IconSearch className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" size={18} />
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="Buscar por título o palabra clave..."
                  className="w-full border border-stone-300 rounded-full pl-10 pr-4 py-3 sm:py-2.5 text-sm bg-white focus:outline-none focus:border-blue-900 transition-colors duration-200"
                />
              </div>

              <div className="flex flex-wrap gap-2">
                {["Todas", "Populares", ...CATEGORIAS].map((cat) => {
                  const activo = categoriaActiva === cat;
                  const colorCategoria = activo && CATEGORIA_COLOR[cat] ? colorDeCategoria(cat) : null;
                  return (
                    <button
                      key={cat}
                      onClick={() => setCategoriaActiva(cat)}
                      className={`text-xs px-3 py-2 sm:py-1.5 rounded-full border transition-colors duration-200 ${
                        activo
                          ? colorCategoria ? "text-white" : "bg-stone-900 text-white border-stone-900"
                          : "border-stone-300 text-stone-600 hover:border-stone-500 hover:text-stone-900"
                      }`}
                      style={colorCategoria ? { backgroundColor: colorCategoria.texto, borderColor: colorCategoria.texto } : undefined}
                    >
                      {cat === "Populares" ? "Más escuchados" : cat}
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {/* Grilla de shiurim */}
          <main className="max-w-6xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8 flex-1 w-full">
            <h2 className="font-serif text-lg text-stone-800 mb-4">
              {categoriaActiva === "Todas" ? "Últimos Shiurim" : categoriaActiva === "Populares" ? "Más Escuchados" : categoriaActiva}
            </h2>
            {cargando ? (
              <p className="text-stone-400 text-sm py-16 text-center">Cargando shiurim...</p>
            ) : filtrados.length === 0 ? (
              <p className="text-stone-500 text-sm py-16 text-center">No se encontraron shiurim con esos criterios.</p>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 md:gap-5">
                {filtrados.map((shiur) => (
                  <ShiurCard
                    key={shiur.id}
                    shiur={shiur}
                    isActive={current && current.id === shiur.id}
                    isPlaying={isPlaying}
                    onOpenDetail={setSelectedShiur}
                    onPlay={handlePlay}
                    isAdmin={isAdmin}
                    onEdit={openEdit}
                    onDelete={handleDeleteShiur}
                  />
                ))}
              </div>
            )}
          </main>

          {/* Pie de página: acceso alternativo a Contacto y Donar */}
          <footer className="border-t border-stone-200 bg-white mt-12">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-stone-500">
              <p>© {new Date().getFullYear()} Rabino Yoel Migdal</p>
              <div className="flex items-center gap-5">
                <button onClick={() => setShowContact(true)} className="hover:text-stone-800 underline-offset-2 hover:underline">
                  Consultar al Rabino
                </button>
                <button onClick={() => setShowDonate(true)} className="hover:text-stone-800 underline-offset-2 hover:underline">
                  Aportar al proyecto
                </button>
              </div>
            </div>
          </footer>

          {/* Elemento de audio único, compartido por toda la app */}
          <audio
            ref={audioRef}
            src={current ? current.audioUrl : undefined}
            onTimeUpdate={handleTimeUpdate}
            onLoadedMetadata={handleLoadedMetadata}
            onEnded={() => setIsPlaying(false)}
            preload="metadata"
          />

          {/* Reproductor flotante */}
          <FloatingPlayer
            current={current}
            isPlaying={isPlaying}
            speed={speed}
            progreso={progreso}
            actual={actual}
            duracion={duracion}
            onTogglePlay={() => setIsPlaying((p) => !p)}
            onSeek={handleSeek}
            onSpeedChange={setSpeed}
            onClose={() => { setCurrent(null); setIsPlaying(false); }}
            onOpenDetail={() => current && setSelectedShiur(current)}
          />

          {/* Vista detallada */}
          {selectedShiur && (
            <ShiurDetailModal
              shiur={selectedShiur}
              onClose={() => setSelectedShiur(null)}
              isActive={current && current.id === selectedShiur.id}
              isPlaying={isPlaying}
              speed={speed}
              progreso={progreso}
              actual={actual}
              duracion={duracion}
              onPlayToggle={() => handlePlay(selectedShiur)}
              onSeek={handleSeek}
              onSpeedChange={setSpeed}
            />
          )}

          {/* Contacto y Donación */}
          {showContact && <ContactModal onClose={() => setShowContact(false)} adminEmail={config.adminEmail} />}
          {showDonate && <DonateModal onClose={() => setShowDonate(false)} mercadoPagoLink={config.mercadoPagoLink} />}

          {/* Ayuda de instalación manual para iOS */}
          {showInstallHelp && <InstallHelpModal onClose={() => setShowInstallHelp(false)} />}

          {/* Login admin (solo aparece via ?admin=true o Ctrl+Shift+A) */}
          {showLogin && <AdminLogin onSuccess={handleLoginSuccess} onCancel={() => setShowLogin(false)} />}

          {/* Botón discreto para reabrir el panel, solo visible ya logueado como admin */}
          {isAdmin && !adminOpen && (
            <button
              onClick={() => setAdminOpen(true)}
              className="fixed top-4 right-4 z-40 w-9 h-9 rounded-full bg-white/90 border border-stone-200 shadow-sm flex items-center justify-center text-stone-500 hover:text-stone-900"
              aria-label="Abrir Panel Admin"
              title="Panel Admin"
            >
              <IconSettings size={16} />
            </button>
          )}

          {/* Panel Admin */}
          {isAdmin && adminOpen && (
            <AdminPanel
              shiurim={shiurim}
              editingShiur={editingShiur}
              onSave={handleSaveShiur}
              onEdit={openEdit}
              onDelete={handleDeleteShiur}
              onClose={() => { setAdminOpen(false); setEditingShiur(null); }}
              onLogout={handleLogout}
              onCancelEdit={() => setEditingShiur(null)}
              config={config}
              onConfigChange={handleConfigChange}
              onExportBackup={handleExportBackup}
              onImportBackup={handleImportBackup}
              onSyncRss={handleSyncRss}
              errorCargaDatos={errorCargaDatos}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ShiurimApp />);
  </script>
</body>
</html>
