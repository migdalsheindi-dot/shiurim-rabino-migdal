name: Sincronizar episodios de Spotify

on:
  schedule:
    - cron: "0 */2 * * *" # cada 2 horas
  workflow_dispatch: {} # botón "Run workflow" manual en la pestaña Actions

concurrency:
  group: sync-spotify
  cancel-in-progress: false

permissions:
  contents: write

env:
  WHISPER_MODEL: small

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias (transcripción con Whisper local, gratis)
        run: pip install -r scripts/requirements.txt

      - name: Cachear el modelo Whisper entre corridas
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: Leer el feed RSS, transcribir episodios pendientes y actualizar data.json
        run: python3 scripts/sync_spotify.py

      - name: Publicar cambios (si hay episodios nuevos, actualizados o transcripciones)
        run: |
          mkdir -p transcripts
          git add data.json transcripts/
          if git diff --cached --quiet; then
            echo "Sin cambios: data.json y transcripts/ ya estaban al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincronizar episodios de Spotify [skip ci]"
          git push
