name: Sincronizar episodios de Spotify

on:
  schedule:
    - cron: "0 */2 * * *" # cada 2 horas
  workflow_dispatch: {} # botón "Run workflow" manual en la pestaña Actions

concurrency:
  group: sync-spotify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Leer el feed RSS y actualizar data.json
        run: python3 scripts/sync_spotify.py

      - name: Publicar cambios (si hay episodios nuevos o actualizados)
        run: |
          if git diff --quiet -- data.json; then
            echo "Sin cambios: data.json ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Sincronizar episodios de Spotify [skip ci]"
          git push
