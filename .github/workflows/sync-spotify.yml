name: Sincronizar episodios de Spotify

on:
  schedule:
    - cron: "0 */2 * * *" # cada 2 horas
  workflow_dispatch: {} # botón "Run workflow" manual en la pestaña Actions

concurrency:
  group: sync-spotify
  cancel-in-progress: false

permissions:
  contents: write

env:
  WHISPER_MODEL: small

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias (transcripción con Whisper local, gratis)
        run: pip install -r scripts/requirements.txt

      - name: Cachear el modelo Whisper entre corridas
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: Leer el feed RSS, transcribir episodios pendientes y actualizar data.json
        run: python3 scripts/sync_spotify.py

      # Una página s/<id>.html por shiur (indexable, con audio y transcripción),
      # una t/<tema>.html por tema, sitemap.xml, robots.txt y una miniatura
      # og/<id>-<hash>.jpg por shiur para la vista previa en WhatsApp. Si
      # falla, igual se publica data.json.
      - name: Generar páginas del sitio (shiurim, temas, sitemap y vista previa al compartir)
        continue-on-error: true
        run: python3 scripts/generar_paginas_shiur.py

      - name: Publicar cambios (si hay episodios nuevos, actualizados o transcripciones)
        run: |
          mkdir -p transcripts s t og
          git add data.json transcripts/ s/ t/ og/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Sin cambios: ya estaba todo al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincronizar episodios de Spotify [skip ci]"
          git push
