                      <p className="text-sm text-stone-800 truncate">{tituloPrincipalDe(s)}</p>
                      <p className="text-xs text-stone-400">{s.categoria} · {formatFecha(s.fecha)} · {reproduccionesDe(s)} reproducciones</p>
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={() => onEdit(s)} className="w-9 h-9 flex items-center justify-center text-stone-500 hover:text-blue-900" aria-label="Editar">
                        <IconPencil size={15} />
                      </button>
                      <button onClick={() => onDelete(s.id)} className="w-9 h-9 flex items-center justify-center text-stone-500 hover:text-red-600" aria-label="Eliminar">
                        <IconTrash size={15} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // Componente principal
    // ---------------------------------------------------------------------
    function ShiurimApp() {
      const [shiurim, setShiurim] = useState([]);
      const [cargando, setCargando] = useState(true);
      const [config, setConfig] = useState(CONFIG_DEFECTO);
      const [errorCargaDatos, setErrorCargaDatos] = useState(false);

      // Carga inicial: data.json del servidor es SIEMPRE la fuente de verdad
      // pública. Se pide con un parámetro de versión (cache-buster) y
      // "cache: no-store" para que ni el navegador ni la CDN del hosting
      // devuelvan una copia vieja guardada en caché — todos los visitantes
      // (cualquier navegador, modo incógnito, otro dispositivo) ven siempre
      // el archivo real y actual. localStorage NUNCA pisa una lectura
      // exitosa de data.json: solo se usa como respaldo si data.json no se
      // pudo leer (sin conexión, archivo roto o ausente).
      // Los visitantes cargan data-lite.json (la misma lista SIN el texto completo de las
      // transcripciones, ~15 veces más liviana); quien entra como administrador carga
      // data.json completo, que es el que se exporta. Si data-lite.json no existe o
      // falla, se usa data.json.
      const cargarJSON = (ruta) =>
        fetch(`${ruta}?v=${Date.now()}`, { cache: "no-store" }).then((r) => {
          if (!r.ok) throw new Error(ruta + " respondió HTTP " + r.status);
          return r.json();
        });
      const [datosCompletos, setDatosCompletos] = useState(false);
      useEffect(() => {
        let cancelado = false;
        let esAdminAlCargar = false;
        try { esAdminAlCargar = localStorage.getItem(STORAGE_KEY_AUTH) === "true"; } catch (e) {}

        (esAdminAlCargar
          ? cargarJSON("./data.json").then((d) => ({ d, completo: true }))
          : cargarJSON("./data-lite.json")
              .then((d) => ({ d, completo: false }))
              .catch(() => cargarJSON("./data.json").then((d) => ({ d, completo: true })))
        )
          .then(({ d: data, completo }) => {
            if (cancelado) return;
            setDatosCompletos(completo);
            if (!data || !Array.isArray(data.shiurim)) {
              throw new Error("data.json no tiene el formato esperado (falta el array 'shiurim').");
            }
            const shiurimValidos = data.shiurim.filter(esShiurValido);
            const configFinal = { ...CONFIG_DEFECTO, ...(data.config || {}) };
            setShiurim(shiurimValidos);
            setConfig(configFinal);
            setErrorCargaDatos(false);
            // Se guarda como respaldo (no como prioridad) para el caso de que,
            // en una próxima visita, no haya conexión o data.json esté caído.
            try { localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify({ config: configFinal, shiurim: shiurimValidos })); } catch (e) {}
          })
          .catch((err) => {
            console.error("No se pudo cargar data.json:", err);
            if (cancelado) return;
            let datosLocales = null;
            try {
              const guardado = localStorage.getItem(STORAGE_KEY_DATA);
              if (guardado) datosLocales = JSON.parse(guardado);
            } catch (e) {}
            if (datosLocales && Array.isArray(datosLocales.shiurim)) {
              setShiurim(datosLocales.shiurim);
              setConfig({ ...CONFIG_DEFECTO, ...(datosLocales.config || {}) });
            } else {
              setShiurim(MOCK_SHIURIM);
              setConfig(CONFIG_DEFECTO);
            }
            setErrorCargaDatos(true);
          })
          .finally(() => { if (!cancelado) setCargando(false); });

        return () => { cancelado = true; };
      }, []);

      // Mientras editás en el Panel Admin (o sincronizás RSS) DENTRO de esta
      // misma sesión, se guarda una copia de respaldo en este navegador a cada
      // cambio. Esto es solo una red de seguridad para no perder trabajo si la
      // pestaña se cierra sin querer antes de exportar — en la PRÓXIMA carga de
      // la página, data.json (del servidor) sigue siendo lo que se muestra.
      useEffect(() => {
        if (cargando) return;
        try {
          localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify({ config, shiurim }));
        } catch (e) {
          // localStorage lleno o no disponible (ej. modo privado): la app sigue
          // funcionando igual, solo que sin este respaldo automático extra.
        }
      }, [shiurim, config, cargando]);

      // Registro del Service Worker (necesario para que el navegador considere
      // la web instalable como PWA, y para que funcione offline). Se usa
      // updateViaCache: "none" para que el propio navegador NUNCA sirva una
      // copia en caché del archivo service-worker.js: así, apenas hay una
      // versión nueva publicada en el hosting, el navegador la detecta de
      // inmediato en la próxima visita en vez de tardar horas en notarlo.
      useEffect(() => {
        if (!("serviceWorker" in navigator) || !navigator.serviceWorker) return;

        navigator.serviceWorker
          .register("./service-worker.js", { updateViaCache: "none" })
          .then((registro) => {
            // Pide de una vez, al cargar la página, que se fije si hay una
            // versión nueva del Service Worker (no espera al chequeo periódico
            // automático del navegador).
            registro.update().catch(() => {});
          })
          .catch((e) => {
            console.error("No se pudo registrar el service worker:", e);
          });

        // Cuando el Service Worker nuevo termina de tomar el control de la
        // página (gracias a skipWaiting + clients.claim en service-worker.js),
        // se recarga la página UNA sola vez de forma automática. Así, alguien
        // que ya tenía la pestaña abierta ve los shiurim nuevos sin tener que
        // cerrar y volver a abrir la web ni enterarse de que hubo un redeploy.
        let yaRecargo = false;
        const alCambiarControlador = () => {
          if (yaRecargo) return;
          yaRecargo = true;
          window.location.reload();
        };
        navigator.serviceWorker.addEventListener("controllerchange", alCambiarControlador);
        return () => navigator.serviceWorker.removeEventListener("controllerchange", alCambiarControlador);
      }, []);

      // Instalación como App (PWA). Chrome/Edge/Android avisan con el evento
      // "beforeinstallprompt" cuando la web cumple los requisitos para
      // instalarse; ahí se guarda ese evento para poder disparar el prompt
      // nativo del navegador al tocar el botón. Safari (iOS/Mac) no tiene este
      // evento: ahí se muestra un instructivo manual en su lugar.
      // Si ya se está corriendo instalada (abierta desde el ícono en la
      // pantalla de inicio), no hay nada que "instalar": display-mode
      // standalone cubre Android/Chrome/Edge, navigator.standalone es la
      // forma específica de Safari/iOS de indicar lo mismo.
      const yaEstaInstalada = () =>
        typeof window !== "undefined" &&
        (window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true);

      const [promptInstalacion, setPromptInstalacion] = useState(() => window.__promptInstalacion || null);
      const [appInstalada, setAppInstalada] = useState(yaEstaInstalada);
      const [showInstallHelp, setShowInstallHelp] = useState(false);

      useEffect(() => {
        const alAntesDeInstalar = () => setPromptInstalacion(window.__promptInstalacion || null);
        const alInstalar = () => {
          setAppInstalada(true);
          setPromptInstalacion(null);
        };
        window.addEventListener("ry-prompt-listo", alAntesDeInstalar);
        window.addEventListener("appinstalled", alInstalar);
        return () => {
          window.removeEventListener("ry-prompt-listo", alAntesDeInstalar);
          window.removeEventListener("appinstalled", alInstalar);
        };
      }, []);

      // Los iPad modernos (iPadOS 13+) se identifican con user-agent de
      // escritorio ("Macintosh"), sin "iPad" — la forma confiable de
      // distinguirlos de una Mac real es que sí tienen pantalla táctil.
      const esAndroid = typeof navigator !== "undefined" && /android/i.test(navigator.userAgent || "");
      const esIOS =
        typeof navigator !== "undefined" &&
        !esAndroid &&
        (/iphone|ipad|ipod/i.test(navigator.userAgent || "") ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));

      // Con el aviso del navegador (Chrome/Edge en Android o computadora) se abre
      // el cuadro nativo de instalación. Si no hay aviso (iPhone, otro navegador,
      // o ya se descartó antes) se muestran los pasos manuales de cada sistema.
      const handleInstalarApp = async () => {
        if (promptInstalacion) {
          try {
            promptInstalacion.prompt();
            await promptInstalacion.userChoice;
          } catch (e) {}
          window.__promptInstalacion = null;
          setPromptInstalacion(null);
        } else if (esIOS || esAndroid) {
          setShowInstallHelp(true);
        }
      };

      const mostrarBotonInstalar = !appInstalada && (promptInstalacion || esIOS || esAndroid);

      const [query, setQuery] = useState(busquedaDesdeUrl);
      const [categoriaActiva, setCategoriaActiva] = useState(() => categoriaDesdeUrl() || "Todas");
      const [menuAbierto, setMenuAbierto] = useState(false);
      const [selectedShiur, setSelectedShiur] = useState(null);
      const [shiurACompartir, setShiurACompartir] = useState(null);
      const [showContact, setShowContact] = useState(false);
      const [showDonate, setShowDonate] = useState(false);

      const [isAdmin, setIsAdmin] = useState(() => {
        try { return localStorage.getItem(STORAGE_KEY_AUTH) === "true"; } catch (e) { return false; }
      });
      const [showLogin, setShowLogin] = useState(false);
      const [adminOpen, setAdminOpen] = useState(false);

      // Si alguien inicia sesión como administrador DESPUÉS de cargar la versión liviana,
      // se pide el data.json completo para que el Panel Admin y la exportación no pierdan
      // el texto de las transcripciones.
      useEffect(() => {
        if (!isAdmin || datosCompletos || cargando) return;
        let cancelado = false;
        cargarJSON("./data.json")
          .then((d) => {
            if (cancelado || !d || !Array.isArray(d.shiurim)) return;
            setShiurim(d.shiurim.filter(esShiurValido));
            setConfig({ ...CONFIG_DEFECTO, ...(d.config || {}) });
            setDatosCompletos(true);
          })
          .catch(() => {});
        return () => { cancelado = true; };
      }, [isAdmin, datosCompletos, cargando]);
      const [statsOpen, setStatsOpen] = useState(false);
      const [editingShiur, setEditingShiur] = useState(null);

      // Audio global (compartido entre barra inferior y vista detalle)
      const audioRef = useRef(null);
      const [current, setCurrent] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(1);
      const [progreso, setProgreso] = useState(0);
      const [actual, setActual] = useState(0);
      const [duracion, setDuracion] = useState(0);

      // Estadísticas de uso (visitas, escuchas, clics de donación): se envían al
      // contador propio, sin cookies y sin IPs. No se registra nada si el contador
      // no está activado, si se entró como administrador o si el navegador pide
      // "No rastrear".
      const rastrear = (ruta, cuerpo) => {
        if (!CONTADOR_URL || isAdmin) return;
        try { if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return; } catch (e) {}
        try {
          fetch(`${CONTADOR_URL}/${ruta}`, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(cuerpo), keepalive: true }).catch(() => {});
        } catch (e) {}
      };
      const escuchaAcumRef = useRef({ id: null, ultimo: 0, seg: 0 });
      const enviarEscucha = () => {
        const a = escuchaAcumRef.current;
        if (a.id && a.seg >= 3) rastrear("escucha", { id: String(a.id), segundos: Math.round(a.seg) });
        a.seg = 0;
      };
      const acumularEscucha = (t) => {
        if (!CONTADOR_URL || isAdmin || !current) return;
        const a = escuchaAcumRef.current;
        if (a.id !== current.id) { enviarEscucha(); escuchaAcumRef.current = { id: current.id, ultimo: t, seg: 0 }; return; }
        const avance = t - a.ultimo;
        a.ultimo = t;
        if (avance > 0 && avance < 3) a.seg += avance; // solo el avance normal (adelantar no suma)
        if (a.seg >= 60) enviarEscucha();
      };
      const enviarEscuchaRef = useRef(enviarEscucha);
      enviarEscuchaRef.current = enviarEscucha;

      // Guardados y progreso de escucha (solo en este dispositivo)
      const [favoritos, setFavoritos] = useState(() => leerJSON(CLAVE_FAVORITOS, []).map(String));
      const toggleFavorito = (id) =>
        setFavoritos((prev) => {
          const clave = String(id);
          const nuevo = prev.includes(clave) ? prev.filter((x) => x !== clave) : [clave, ...prev];
          guardarJSON(CLAVE_FAVORITOS, nuevo);
          return nuevo;
        });
      const [progresos, setProgresos] = useState(() => leerJSON(CLAVE_PROGRESO, {}));
      const progresosRef = useRef(progresos);
      const ultimoGuardadoRef = useRef(0);
      const pendienteRef = useRef(0); // minuto al que hay que saltar cuando cargue el audio

      const guardarProgreso = (forzar = false) => {
        const audio = audioRef.current;
        if (!audio || !current || !audio.duration || isNaN(audio.duration)) return;
        const ahora = Date.now();
        if (!forzar && ahora - ultimoGuardadoRef.current < 5000) return;
        const t = audio.currentTime;
        const d = audio.duration;
        const mapa = { ...progresosRef.current };
        const clave = String(current.id);
        if (d - t < 20) delete mapa[clave]; // lo terminó: ya no aparece como "empezado"
        else if (t >= 5) mapa[clave] = { t: Math.floor(t), d: Math.floor(d), u: ahora };
        else return;
        // Máximo de shiurim recordados: se descartan los más viejos
        const claves = Object.keys(mapa);
        if (claves.length > MAX_PROGRESOS) {
          claves.sort((a, b) => mapa[b].u - mapa[a].u).slice(MAX_PROGRESOS).forEach((k) => delete mapa[k]);
        }
        ultimoGuardadoRef.current = ahora;
        progresosRef.current = mapa;
        setProgresos(mapa);
        guardarJSON(CLAVE_PROGRESO, mapa);
      };
      // Guarda también al pausar, al cerrar la pestaña o al pasar la app a segundo plano
      const guardarProgresoRef = useRef(guardarProgreso);
      guardarProgresoRef.current = guardarProgreso;
      useEffect(() => {
        const alSalir = () => { guardarProgresoRef.current(true); enviarEscuchaRef.current(); };
        const alOcultar = () => { if (document.visibilityState === "hidden") alSalir(); };
        window.addEventListener("pagehide", alSalir);
        document.addEventListener("visibilitychange", alOcultar);
        return () => {
          window.removeEventListener("pagehide", alSalir);
          document.removeEventListener("visibilitychange", alOcultar);
        };
      }, []);
      useEffect(() => { if (!isPlaying) { guardarProgresoRef.current(true); enviarEscuchaRef.current(); } }, [isPlaying]);

      // Acceso admin por URL: ?admin=true
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("admin") === "true" && !isAdmin) setShowLogin(true);
      }, []);

      // Compartir: si el navegador tiene la hoja nativa de compartir
      // (celulares, Safari, Chrome de escritorio en Windows/Mac) se usa esa;
      // si no existe, o falla por algo distinto a que la persona la cierre,
      // se abre el modal con el enlace para copiar. navigator.share se llama
      // de forma síncrona dentro del click, que es lo que exigen los navegadores.
      const handleCompartir = async (shiur) => {
        if (navigator.share) {
          const titulo = tituloPrincipalDe(shiur);
          try {
            await navigator.share({ title: titulo, text: `${titulo} — Rabino Yoel Migdal`, url: urlDeShiur(shiur) });
            return;
          } catch (e) {
            if (e && e.name === "AbortError") return; // cerró la hoja sin compartir: no es un error
          }
        }
        setShiurACompartir(shiur);
      };

      // Enlace directo ?shiur=<id>: al terminar de cargar los datos se abre
      // ese shiur (si el id no existe, simplemente se ignora). Después, el
      // parámetro de la URL acompaña al modal de detalle (se agrega al abrir
      // y se quita al cerrar) sin tocar otros parámetros como ?admin=true.
      const idEnUrl = useRef(new URLSearchParams(window.location.search).get("shiur"));
      const [enlaceResuelto, setEnlaceResuelto] = useState(!idEnUrl.current);

      useEffect(() => {
        if (cargando || enlaceResuelto) return;
        const encontrado = shiurim.find((s) => String(s.id) === String(idEnUrl.current));
        if (encontrado) setSelectedShiur(encontrado);
        setEnlaceResuelto(true);
      }, [cargando, enlaceResuelto, shiurim]);

      useEffect(() => {
        if (!enlaceResuelto) return;
        try {
          const url = new URL(window.location.href);
          if (selectedShiur) url.searchParams.set("shiur", selectedShiur.id);
          else url.searchParams.delete("shiur");
          window.history.replaceState(null, "", url);
        } catch (e) {}
      }, [selectedShiur, enlaceResuelto]);

      // Título, descripción y enlace canónico según lo que se está mirando
      useEffect(() => {
        const base = (CABECERA_INICIAL.canonical || "").replace(/[^/]*$/, "");
        const sufijo = " | Rabino Yoel Migdal";
        if (selectedShiur) {
          const { subtitulo, descripcion } = separarDescripcion(selectedShiur.descripcion);
          actualizarCabecera({
            titulo: tituloPrincipalDe(selectedShiur) + sufijo,
            descripcion: (subtitulo || descripcion || CABECERA_INICIAL.description).replace(/\s+/g, " ").slice(0, 158),
            canonical: `${base}s/${selectedShiur.id}.html`,
          });
        } else if (categoriaActiva !== "Todas" && DESCRIPCION_TEMAS[categoriaActiva]) {
          actualizarCabecera({
            titulo: `${categoriaActiva}: shiurim y clases${sufijo}`,
            descripcion: DESCRIPCION_TEMAS[categoriaActiva],
            canonical: `${base}t/${slugDe(categoriaActiva)}.html`,
          });
        } else if (query.trim()) {
          actualizarCabecera({ titulo: `Buscar “${query.trim().slice(0, 40)}”${sufijo}`, descripcion: CABECERA_INICIAL.description, canonical: CABECERA_INICIAL.canonical });
        } else {
          actualizarCabecera({ titulo: CABECERA_INICIAL.title, descripcion: CABECERA_INICIAL.description, canonical: CABECERA_INICIAL.canonical });
        }
      }, [selectedShiur, categoriaActiva, query]);

      // Atajo de teclado: Ctrl+Shift+A
      useEffect(() => {
        const handler = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) {
            if (!isAdmin) setShowLogin(true);
            else setAdminOpen(true);
          }
        };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [isAdmin]);

      // Play / pausa reales
      useEffect(() => {
        const audio = audioRef.current;
        if (!audio) return;
        if (isPlaying) audio.play().catch(() => {});
        else audio.pause();
      }, [isPlaying, current && current.id]);

      // Velocidad real
      useEffect(() => {
        if (audioRef.current) audioRef.current.playbackRate = speed;
      }, [speed, current && current.id]);

      // Reinicio al cambiar de shiur
      useEffect(() => {
        setProgreso(0);
        setActual(0);
        setDuracion(0);
      }, [current && current.id]);

      // Media Session API: controles desde pantalla de bloqueo / notificaciones del celular
      useEffect(() => {
        if (!("mediaSession" in navigator) || !current) return;
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: tituloPrincipalDe(current),
            artist: "Rabino Yoel Migdal",
            album: current.categoria,
            artwork: current.portadaUrl ? [{ src: current.portadaUrl, sizes: "512x512", type: "image/jpeg" }] : [],
          });
          navigator.mediaSession.setActionHandler("play", () => setIsPlaying(true));
          navigator.mediaSession.setActionHandler("pause", () => setIsPlaying(false));
          navigator.mediaSession.setActionHandler("seekbackward", (details) => {
            const audio = audioRef.current;
            if (audio) audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10));
          });
          navigator.mediaSession.setActionHandler("seekforward", (details) => {
            const audio = audioRef.current;
            if (audio) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (details.seekOffset || 10));
          });
        } catch (e) {}
        return () => {
          try {
            ["play", "pause", "seekbackward", "seekforward"].forEach((a) => navigator.mediaSession.setActionHandler(a, null));
          } catch (e) {}
        };
      }, [current && current.id]);

      useEffect(() => {
        if ("mediaSession" in navigator) {
          try { navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused"; } catch (e) {}
        }
      }, [isPlaying]);

      // Reproducciones contadas por el servicio propio (shiur.id -> total). Solo
      // se piden cuando se entra como administrador: es lo que muestra el Panel
      // Admin. null = servicio desactivado o sin respuesta (se usa el número a mano).
      const [conteos, setConteos] = useState(null);
      useEffect(() => {
        if (!CONTADOR_URL || !isAdmin) return;
        let cancelado = false;
        fetch(`${CONTADOR_URL}/conteos`, { cache: "no-store" })
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => { if (!cancelado && d && d.conteos) setConteos(d.conteos); })
          .catch(() => {});
        return () => { cancelado = true; };
      }, [isAdmin]);

      // Cuenta una reproducción cuando se escuchan 30 s reales seguidos de un
      // shiur. Solo suma el avance normal del audio (un salto al adelantar o
      // retroceder no cuenta), tiene en cuenta la velocidad, y la misma persona
      // suma como mucho 1 vez cada 6 h por shiur. Las escuchas del
      // administrador no cuentan.
      const escuchaRef = useRef({ id: null, ultimo: 0, segundos: 0, enviado: false });
      const registrarEscucha = (tiempoActual) => {
        if (!CONTADOR_URL || isAdmin || !current) return;
        const r = escuchaRef.current;
        if (r.id !== current.id) {
          escuchaRef.current = { id: current.id, ultimo: tiempoActual, segundos: 0, enviado: false };
          return;
        }
        const avance = tiempoActual - r.ultimo;
        r.ultimo = tiempoActual;
        if (avance > 0 && avance < 3) r.segundos += avance / (speed || 1);
        if (r.enviado || r.segundos < SEGUNDOS_PARA_CONTAR) return;
        r.enviado = true;
        const clave = `ry_escucha_${current.id}`;
        try {
          const ultimaVez = Number(localStorage.getItem(clave)) || 0;
          if (Date.now() - ultimaVez < HORAS_ENTRE_CONTEOS * 3600 * 1000) return;
          localStorage.setItem(clave, String(Date.now()));
        } catch (e) {}
        fetch(`${CONTADOR_URL}/reproduccion`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: String(current.id) }),
          keepalive: true,
        }).catch(() => {});
      };

      const handleTimeUpdate = () => {
        const audio = audioRef.current;
        if (!audio || !audio.duration) return;
        setActual(audio.currentTime);
        setProgreso((audio.currentTime / audio.duration) * 100);
        registrarEscucha(audio.currentTime);
        acumularEscucha(audio.currentTime);
        guardarProgreso();
      };
      const handleLoadedMetadata = () => {
        const audio = audioRef.current;
        if (!audio) return;
        setDuracion(audio.duration || 0);
        // Si el shiur estaba empezado, retoma donde se quedó
        const pendiente = pendienteRef.current;
        pendienteRef.current = 0;
        if (pendiente > 0 && audio.duration > pendiente + 5) audio.currentTime = pendiente;
      };
      const handleSeek = (valor) => {
        const audio = audioRef.current;
        setProgreso(valor);
        if (audio && audio.duration) audio.currentTime = (valor / 100) * audio.duration;
      };

      const handlePlay = (shiur) => {
        if (current && current.id === shiur.id) setIsPlaying((p) => !p);
        else {
          guardarProgreso(true); // guarda dónde quedó el shiur anterior
          const p = progresosRef.current[String(shiur.id)];
          pendienteRef.current = p && p.t >= 5 ? p.t : 0;
          setCurrent(shiur);
          setIsPlaying(true);
        }
      };

      const RECIENTES_LIMITE = 6;
      const POPULARES_LIMITE = 6;
      const filtrados = useMemo(() => {
        const normalizar = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const q = normalizar(query);
        const coincideTexto = (s) =>
          normalizar(s.titulo).includes(q) ||
          normalizar(s.descripcion).includes(q) ||
          normalizar(s.categoria).includes(q);

        if (categoriaActiva === "Guardados") {
          // En el orden en que se guardaron (el último guardado, primero)
          return favoritos
            .map((id) => shiurim.find((x) => String(x.id) === id))
            .filter((x) => x && coincideTexto(x));
        }

        if (categoriaActiva === "Populares") {
          const base = shiurim.filter(coincideTexto);
          return [...base].sort((a, b) => (Number(b.reproducciones) || 0) - (Number(a.reproducciones) || 0)).slice(0, POPULARES_LIMITE);
        }

        const base = shiurim.filter((s) => {
          const coincideCategoria = categoriaActiva === "Todas" || s.categoria === categoriaActiva;
          return coincideTexto(s) && coincideCategoria;
        });
        const ordenados = [...base].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        return categoriaActiva === "Todas" && !query.trim() ? ordenados.slice(0, RECIENTES_LIMITE) : ordenados;
      }, [shiurim, query, categoriaActiva, favoritos]);

      // Pantalla de inicio (categoría "Todas" y sin buscar): primero los
      // shiurim más nuevos (carrusel) y después los 4 shiurim destacados, elegidos a mano.
      // La lista es config.destacados en data.json (ids de shiurim, en el orden
      // en que se muestran). Si un id ya no existe, simplemente se saltea.
      const INICIO_RECIENTES = 5;
      const INICIO_DESTACADOS = 4;
      const esInicio = categoriaActiva === "Todas" && !query.trim();
      const vistaActual = selectedShiur
        ? `shiur:${selectedShiur.id}`
        : categoriaActiva !== "Todas" ? `tema:${categoriaActiva}` : query.trim() ? "busqueda" : "inicio";
      const rastrearRef = useRef(rastrear);
      rastrearRef.current = rastrear;
      useEffect(() => {
        if (cargando || !enlaceResuelto) return;
        const t = setTimeout(() => rastrearRef.current("visita", { pagina: vistaActual }), 600);
        return () => clearTimeout(t);
      }, [vistaActual, cargando, enlaceResuelto]);
      const inicioRecientes = useMemo(
        () => [...shiurim].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, INICIO_RECIENTES),
        [shiurim]
      );
      const inicioDestacados = useMemo(
        () =>
          (Array.isArray(config.destacados) ? config.destacados : [])
            .map((id) => shiurim.find((s) => String(s.id) === String(id)))
            .filter(Boolean)
            .slice(0, INICIO_DESTACADOS),
        [shiurim, config.destacados]
      );
      const seguirEscuchando = useMemo(
        () =>
          Object.keys(progresos)
            .map((id) => ({ shiur: shiurim.find((x) => String(x.id) === id), u: progresos[id].u }))
            .filter((x) => x.shiur && avanceDe(progresos, x.shiur))
            .sort((a, b) => b.u - a.u)
            .slice(0, 6)
            .map((x) => x.shiur),
        [progresos, shiurim]
      );
      const claseGrilla = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 md:gap-5";
      const filaDeShiur = (shiur) => (
        <ShiurFila
          key={shiur.id}
          shiur={shiur}
          isActive={current && current.id === shiur.id}
          isPlaying={isPlaying}
          onOpenDetail={setSelectedShiur}
          onPlay={handlePlay}
          onShare={handleCompartir}
          isAdmin={isAdmin}
          onEdit={openEdit}
          onDelete={handleDeleteShiur}
        />
      );
      const destacadoDeShiur = (shiur) => (
        <ShiurDestacado
          key={shiur.id}
          shiur={shiur}
          isActive={current && current.id === shiur.id}
          isPlaying={isPlaying}
          onOpenDetail={setSelectedShiur}
          onPlay={handlePlay}
          onShare={handleCompartir}
          isAdmin={isAdmin}
          onEdit={openEdit}
          onDelete={handleDeleteShiur}
        />
      );
      const tarjetaDeShiur = (shiur, compacta = false) => (
        <ShiurCard
          key={shiur.id}
          compacta={compacta}
          shiur={shiur}
          isActive={current && current.id === shiur.id}
          isPlaying={isPlaying}
          onOpenDetail={setSelectedShiur}
          onPlay={handlePlay}
          onShare={handleCompartir}
          isAdmin={isAdmin}
          onEdit={openEdit}
          onDelete={handleDeleteShiur}
        />
      );

      const handleLoginSuccess = () => {
        setIsAdmin(true);
        try { localStorage.setItem(STORAGE_KEY_AUTH, "true"); } catch (e) {}
        setShowLogin(false);
        setAdminOpen(true);
      };

      const handleLogout = () => {
        setIsAdmin(false);
        try { localStorage.removeItem(STORAGE_KEY_AUTH); } catch (e) {}
        setAdminOpen(false);
        setEditingShiur(null);
      };

      const handleSaveShiur = (data) => {
        if (editingShiur) {
          setShiurim((prev) => prev.map((s) => (s.id === editingShiur.id ? { ...data, id: editingShiur.id } : s)));
        } else {
          setShiurim((prev) => [{ ...data, id: Date.now() }, ...prev]);
        }
        setEditingShiur(null);
      };

      const handleDeleteShiur = (id) => {
        if (!window.confirm("¿Eliminar este shiur? Esta acción no se puede deshacer.")) return;
        setShiurim((prev) => prev.filter((s) => s.id !== id));
        if (current && current.id === id) { setCurrent(null); setIsPlaying(false); }
        if (selectedShiur && selectedShiur.id === id) setSelectedShiur(null);
      };

      const openEdit = (shiur) => { setEditingShiur(shiur); setAdminOpen(true); };

      const handleConfigChange = (field, value) => setConfig((c) => ({ ...c, [field]: value }));

      // Importa episodios ya parseados desde un feed RSS: agrega los que no
      // existen (por audioUrl, para nunca duplicar) y actualiza
      // título/portada/fecha/descripción de los que ya existen. La categoría y
      // el título principal (si lo cargaste a mano) NUNCA se pisan en un shiur
      // ya existente, y la transcripción solo se completa si todavía estaba
      // vacía. Las reproducciones cargadas a mano tampoco se tocan.
      const handleSyncRss = (episodios) => {
        const porAudio = new Map(shiurim.map((s) => [s.audioUrl, s]));
        let agregados = 0;
        let actualizados = 0;
        let conTranscripcion = 0;
        const resultado = [...shiurim];
        episodios.forEach((ep, idx) => {
          const existente = porAudio.get(ep.audioUrl);
          if (existente) {
            const i = resultado.findIndex((s) => s.id === existente.id);
            const yaTeniaTranscripcion = existente.transcripcion && existente.transcripcion.trim();
            const transcripcionFinal = yaTeniaTranscripcion ? existente.transcripcion : (ep.transcripcion || "");
            if (!yaTeniaTranscripcion && transcripcionFinal) conTranscripcion++;
            resultado[i] = {
              ...existente,
              titulo: ep.titulo || existente.titulo,
              portadaUrl: ep.portadaUrl || existente.portadaUrl,
              fecha: ep.fecha || existente.fecha,
              descripcion: ep.descripcion || existente.descripcion,
              transcripcion: transcripcionFinal,
            };
            actualizados++;
          } else {
            if (ep.transcripcion) conTranscripcion++;
            resultado.push({
              id: Date.now() + idx,
              titulo: ep.titulo,
              categoria: ep.categoria,
              fecha: ep.fecha,
              audioUrl: ep.audioUrl,
              portadaUrl: ep.portadaUrl,
              descripcion: ep.descripcion,
              transcripcion: ep.transcripcion || "",
              reproducciones: 0,
            });
            agregados++;
          }
        });
        setShiurim(resultado);
        return { agregados, actualizados, conTranscripcion };
      };

      // Backup único: junta shiurim + configuración en un solo archivo (data.json),
      // con EXACTAMENTE la misma forma que la carga inicial espera leer.
      const handleExportBackup = () => {
        // data.json es público: si un backup viejo trae adminEmail, no se vuelve a publicar.
        const { adminEmail, ...configPublica } = config;
        const blob = new Blob([JSON.stringify({ config: configPublica, shiurim }, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "data.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImportBackup = (data) => {
        if (!data || typeof data !== "object") { alert("El archivo no tiene un formato válido."); return; }
        if (Array.isArray(data.shiurim)) setShiurim(data.shiurim);
        else if (Array.isArray(data)) setShiurim(data); // compatibilidad con backups viejos (solo shiurim.json)
        if (data.config) setConfig({ ...CONFIG_DEFECTO, ...data.config });
      };

      return (
        <UsuarioContext.Provider value={{ favoritos, toggleFavorito, progresos }}>
        <div className="min-h-screen bg-stone-50 flex flex-col">
          {/* Encabezado */}
          <header className="sticky top-0 z-40 border-b border-stone-200/70 bg-white/90 backdrop-blur-md safe-top">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 sm:py-6">
              <div className="flex items-center justify-between gap-2 sm:gap-3">
                <div className="flex items-center gap-2 sm:gap-3 min-w-0">
                  <button
                    onClick={() => setMenuAbierto(true)}
                    className="shrink-0 w-11 h-11 flex items-center justify-center rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-500 transition-colors duration-200"
                    aria-label="Abrir menú"
                  >
                    <IconMenu size={20} />
                  </button>
                  <button
                    onClick={() => { setCategoriaActiva("Todas"); setQuery(""); window.scrollTo({ top: 0 }); }}
                    className="flex items-center gap-2 sm:gap-3 min-w-0 text-left rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-900"
                    aria-label="Rabino Yoel Migdal, ir al inicio"
                  >
                    <img src="icons/logo-ym.svg" alt="" width="80" height="72" className="shrink-0 h-9 w-10 sm:h-11 sm:w-12 md:h-12 md:w-[53px]" />
                    <span className="min-w-0 block">
                      <span className="block font-serif text-[16px] min-[390px]:text-[17px] sm:text-2xl md:text-3xl text-stone-900 tracking-tight sm:whitespace-nowrap leading-[1.15]">Rabino<span className="sm:hidden"><br /></span><span className="hidden sm:inline"> </span>Yoel Migdal</span>
                      <span className="hidden sm:block font-serif italic text-stone-500 text-sm mt-0.5">Shiurim</span>
                    </span>
                  </button>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button
                    onClick={() => setShowContact(true)}
                    className="flex items-center justify-center gap-1.5 w-11 h-11 sm:w-auto sm:h-10 sm:px-4 text-sm text-stone-600 border border-stone-300 rounded-full hover:bg-stone-50 transition-colors"
                    aria-label="Contacto"
                  >
                    <IconMail size={16} />
                    <span className="hidden sm:inline">Contacto</span>
                  </button>
                  <button
                    onClick={() => { rastrear("evento", { tipo: "donar_abrir", origen: "encabezado", contexto: vistaActual }); setShowDonate(true); }}
                    className="btn-navy flex items-center h-11 sm:h-10 px-4 sm:px-5 text-sm font-medium rounded-full"
                  >
                    Donar
                  </button>
                </div>
              </div>
            </div>
          </header>

          <MenuLateral
            abierto={menuAbierto}
            onClose={() => setMenuAbierto(false)}
            query={query}
            onQueryChange={setQuery}
            categoriaActiva={categoriaActiva}
            onCategoriaChange={setCategoriaActiva}
            mostrarInstalar={!!mostrarBotonInstalar}
            onInstalar={() => { setMenuAbierto(false); handleInstalarApp(); }}
            onContacto={() => { setMenuAbierto(false); setShowContact(true); }}
            onDonar={() => { rastrear("evento", { tipo: "donar_abrir", origen: "menu", contexto: vistaActual }); setMenuAbierto(false); setShowDonate(true); }}
          />

          {/* Hero: foto, frase y buscador (se pliega al buscar o elegir un tema) */}
          <Hero
            esInicio={esInicio}
            query={query}
            onQuery={setQuery}
            categoria={categoriaActiva}
            onVolver={() => { setCategoriaActiva("Todas"); setQuery(""); }}
          />

          <main className={`max-w-6xl mx-auto px-4 sm:px-6 pt-8 sm:pt-12 pb-10 flex-1 w-full ${cargando ? "min-h-[130vh]" : ""}`}>
            {cargando ? (
              <React.Fragment>
                <h2 className="font-serif text-2xl font-semibold text-blue-900 mb-4">Últimos Shiurim</h2>
                <p className="text-stone-500 text-sm py-16 text-center">Cargando shiurim...</p>
              </React.Fragment>
            ) : esInicio && shiurim.length > 0 ? (
              <div className="space-y-12 sm:space-y-16">
                {seguirEscuchando.length > 0 && (
                  <Reveal>
                    <Carrusel id="inicio-seguir" titulo="Seguir escuchando">
                      {seguirEscuchando.map(filaDeShiur)}
                    </Carrusel>
                  </Reveal>
                )}
                <Reveal>
                  <TemasDelInicio
                    shiurim={shiurim}
                    cantidadGuardados={favoritos.filter((id) => shiurim.some((x) => String(x.id) === id)).length}
                    onElegir={(cat) => { setCategoriaActiva(cat); window.scrollTo({ top: 0 }); }}
                  />
                </Reveal>
                <Reveal>
                  <Carrusel id="inicio-recientes" titulo="Últimos Shiurim">
                    {inicioRecientes.map(filaDeShiur)}
                  </Carrusel>
                </Reveal>
                {inicioDestacados.length > 0 && (
                  <Reveal>
                    <Carrusel id="inicio-destacados" titulo="Destacados">
                      {inicioDestacados.map(destacadoDeShiur)}
                    </Carrusel>
                  </Reveal>
                )}
              </div>
            ) : (
              <React.Fragment>
                <div className="flex items-baseline justify-between gap-3 mb-5">
                  <h2 className="font-serif text-2xl sm:text-[28px] font-semibold text-blue-900 leading-none">
                    {categoriaActiva === "Todas" ? (query.trim() ? "Resultados" : "Últimos Shiurim") : categoriaActiva === "Populares" ? "Más Escuchados" : categoriaActiva === "Guardados" ? "Guardados" : categoriaActiva}
                  </h2>
                  <span className="text-[13px] text-stone-500 shrink-0">
                    {filtrados.length} {filtrados.length === 1 ? "shiur" : "shiurim"}
                  </span>
                </div>
                {filtrados.length === 0 ? (
                  categoriaActiva === "Guardados" && !query.trim() ? (
                    <div className="py-16 text-center max-w-sm mx-auto">
                      <div className="mx-auto w-14 h-14 rounded-full bg-gold-100 text-gold-600 flex items-center justify-center mb-4"><IconHeart size={26} /></div>
                      <p className="font-serif text-xl text-blue-900 mb-2">Todavía no guardaste nada</p>
                      <p className="text-stone-600 text-sm leading-relaxed">Tocá el corazón de cualquier shiur para guardarlo acá y encontrarlo rápido cuando quieras.</p>
                    </div>
                  ) : (
                    <p className="text-stone-600 text-sm py-16 text-center">No se encontraron shiurim con esos criterios.</p>
                  )
                ) : (
                  <div className={claseGrilla}>{filtrados.map((s) => tarjetaDeShiur(s))}</div>
                )}
              </React.Fragment>
            )}
          </main>

          {esInicio && !cargando && shiurim.length > 0 && <SobreElRabino />}

          {/* Dedicatoria permanente: va en todas las pantallas (inicio, temas, búsquedas) */}
          <footer
            className={`bg-[#0B1428] border-t border-white/10 text-center px-5 pt-8 ${current ? "pb-32" : "pb-[max(2.25rem,env(safe-area-inset-bottom))]"}`}
          >
            <div className="mx-auto mb-5 h-px w-16 bg-gradient-to-r from-transparent via-gold-500 to-transparent" aria-hidden="true" />
            <p className="font-serif italic text-gold-100/90 text-[15px] sm:text-base leading-relaxed tracking-wide">
              Leilui Nishmat Shaia ben Hersh wolf Z”L
            </p>
          </footer>

          {/* Elemento de audio único, compartido por toda la app */}
          <audio
            ref={audioRef}
            src={current ? current.audioUrl : undefined}
            onTimeUpdate={handleTimeUpdate}
            onLoadedMetadata={handleLoadedMetadata}
            onEnded={() => {
              pendienteRef.current = 0;
              if (current) {
                const mapa = { ...progresosRef.current };
                delete mapa[String(current.id)];
                progresosRef.current = mapa;
                setProgresos(mapa);
                guardarJSON(CLAVE_PROGRESO, mapa);
              }
              setIsPlaying(false);
            }}
            preload="metadata"
          />

          {/* Reproductor flotante */}
          <FloatingPlayer
            current={current}
            isPlaying={isPlaying}
            speed={speed}
            progreso={progreso}
            actual={actual}
            duracion={duracion}
            onTogglePlay={() => setIsPlaying((p) => !p)}
            onSeek={handleSeek}
            onSpeedChange={setSpeed}
            onClose={() => { setCurrent(null); setIsPlaying(false); }}
            onOpenDetail={() => current && setSelectedShiur(current)}
          />

          {/* Vista detallada */}
          {selectedShiur && (
            <ShiurDetailModal
              shiur={selectedShiur}
              onClose={() => setSelectedShiur(null)}
              isActive={current && current.id === selectedShiur.id}
              isPlaying={isPlaying}
              speed={speed}
              progreso={progreso}
              actual={actual}
              duracion={duracion}
              onPlayToggle={() => handlePlay(selectedShiur)}
              onSeek={handleSeek}
              onSpeedChange={setSpeed}
              onShare={handleCompartir}
            />
          )}

          {/* Compartir (respaldo sin navigator.share) */}
          {shiurACompartir && <CompartirModal shiur={shiurACompartir} onClose={() => setShiurACompartir(null)} />}

          {/* Contacto y Donación */}
          {showContact && <ContactModal onClose={() => setShowContact(false)} />}
          {showDonate && (
            <DonateModal
              onClose={() => setShowDonate(false)}
              mercadoPagoLink={config.mercadoPagoLink}
              onDonar={() => rastrear("evento", { tipo: "donar_click", origen: "modal", contexto: vistaActual })}
            />
          )}

          {/* Ayuda de instalación manual para iOS */}
          {showInstallHelp && <InstallHelpModal plataforma={esIOS ? "ios" : "android"} onClose={() => setShowInstallHelp(false)} />}

          {/* Login admin (solo aparece via ?admin=true o Ctrl+Shift+A) */}
          {showLogin && <AdminLogin onSuccess={handleLoginSuccess} onCancel={() => setShowLogin(false)} />}

          {/* Botón discreto para reabrir el panel, solo visible ya logueado como admin */}
          {isAdmin && !adminOpen && (
            <button
              onClick={() => setAdminOpen(true)}
              className="fixed top-4 right-4 z-40 w-9 h-9 rounded-full bg-white/90 border border-stone-200 shadow-sm flex items-center justify-center text-stone-500 hover:text-stone-900"
              aria-label="Abrir Panel Admin"
              title="Panel Admin"
            >
              <IconSettings size={16} />
            </button>
          )}
          {isAdmin && !adminOpen && (
            <button
              onClick={() => setStatsOpen(true)}
              className="fixed top-4 right-14 z-40 w-9 h-9 rounded-full bg-white/90 border border-stone-200 shadow-sm flex items-center justify-center text-stone-500 hover:text-stone-900"
              aria-label="Abrir estadísticas"
              title="Estadísticas"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="20" x2="6" y2="11" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="18" y1="20" x2="18" y2="14" /></svg>
            </button>
          )}

          {/* Panel de Estadísticas (solo admin, necesita además la clave del contador) */}
          {isAdmin && statsOpen && <PanelEstadisticas shiurim={shiurim} onClose={() => setStatsOpen(false)} />}

          {/* Panel Admin */}
          {isAdmin && adminOpen && (
            <AdminPanel
              shiurim={shiurim}
              editingShiur={editingShiur}
              onSave={handleSaveShiur}
              onEdit={openEdit}
              onDelete={handleDeleteShiur}
              onClose={() => { setAdminOpen(false); setEditingShiur(null); }}
              onLogout={handleLogout}
              onAbrirEstadisticas={() => setStatsOpen(true)}
              onCancelEdit={() => setEditingShiur(null)}
              conteos={conteos}
              config={config}
              onConfigChange={handleConfigChange}
              onExportBackup={handleExportBackup}
              onImportBackup={handleImportBackup}
              onSyncRss={handleSyncRss}
              errorCargaDatos={errorCargaDatos}
            />
          )}
        </div>
        </UsuarioContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ShiurimApp />);
  </script>
</body>
</html>
