    function formatFecha(fechaStr) {

    function formatTiempo(seg) {
      if (!seg || isNaN(seg)) return "0:00";
      const m = Math.floor(seg / 60);

      return `${m}:${s}`;

    function esShiurValido(s) {

    function tituloPrincipalDe(shiur) {

    // partes con un salto de línea: la primera línea es el "subtítulo" (una
    // bajada corta), el resto es la descripción completa. Si no hay salto de

    // frase de descripción), se sigue mostrando todo como descripción, sin
    // subtítulo — no cambia nada de lo que ya se veía.
    function separarDescripcion(descripcionCompleta) {
      const texto = (descripcionCompleta || "").trim();
      const salto = texto.indexOf("\n");
      if (salto === -1) return { subtitulo: "", descripcion: texto };
      return { subtitulo: texto.slice(0, salto).trim(), descripcion: texto.slice(salto + 1).trim() };
    }

    // Enlace para compartir un shiur: s/<id>.html, una página estática con la
    // portada y el título de ESE shiur (etiquetas Open Graph) que redirige al
    // shiur real (?shiur=<id>). Hace falta porque WhatsApp/Telegram arman la
    // vista previa leyendo solo el HTML, sin ejecutar JavaScript. Las páginas
    // las genera scripts/generar_paginas_shiur.py en el workflow de sync; si
    // una todavía no existe, 404.html redirige igual al shiur. Se resuelve
    // relativo a la URL actual, así no se filtra ?admin=true al compartir.
    function urlDeShiur(shiur) {
      try {
        return new URL(`s/${shiur.id}.html`, window.location.href).toString();
      } catch (e) {
        return `${window.location.href.split(/[?#]/)[0]}?shiur=${shiur.id}`;
      }

    // Copia texto al portapapeles. Usa la API moderna (solo en contexto seguro,
    // HTTPS) y, si falla o no existe, el método antiguo con el input ya
    // seleccionado. Devuelve true/false según haya funcionado.
    async function copiarAlPortapapeles(texto, inputEl) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(texto);
          return true;
        }
      } catch (e) {}
      try {
        if (inputEl) {
          inputEl.focus();
          inputEl.select();
          inputEl.setSelectionRange(0, texto.length);
        }
        return document.execCommand("copy");
      } catch (e) {
        return false;
      }
    }

    // ---------------------------------------------------------------------
    // Importación de episodios desde un feed RSS (Spotify for Creators / Anchor
    // y, en general, cualquier feed de podcast estándar): lectura del feed,
    // categorización automática por palabras clave, e importación de
    // transcripciones reales cuando el feed las publica (etiqueta estándar
    // <podcast:transcript>, la que usa Spotify for Creators).
    // ---------------------------------------------------------------------
    function textoDe(nodo, tag) {
      const el = nodo.getElementsByTagName(tag)[0];
      return el ? el.textContent : "";
    }
    function atributoDe(nodo, tag, attr) {
      const el = nodo.getElementsByTagName(tag)[0];
      return el ? el.getAttribute(attr) : "";
    }

    async function fetchTextUrl(url) {
      // 1) Intento directo: algunas URLs sí permiten leerse desde el navegador.
      try {
        const directa = await fetch(url);
        if (directa.ok) {
          const texto = await directa.text();
          if (texto && texto.trim().length > 0) return texto;
        }
      } catch (e) {
        // Sigue con el proxy de abajo.
      }
      // 2) La gran mayoría de los feeds de Spotify for Creators / Anchor (y los
      //    archivos de transcripción que enlazan) no permiten que un navegador
      //    los lea de forma directa (por política de CORS del propio servidor,
      //    no del código de esta web). Se usa un proxy público de solo lectura
      //    como puente, sin necesidad de credenciales ni de un backend propio.
      const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
      const viaProxy = await fetch(proxy);
      if (!viaProxy.ok) throw new Error("No se pudo acceder a " + url);
      return await viaProxy.text();
    }

    // --- Categorización automática por palabras clave en título/descripción ---
    // Quita tildes/diacríticos (á -> a, é -> e, etc.): normaliza el texto y
    // descarta los caracteres de combinación Unicode (rango U+0300–U+036F,
    // los que quedan "sueltos" arriba de cada letra tras normalizar con NFD).
    const CARACTERES_DIACRITICOS = new RegExp("[̀-ͯ]", "g");
    function quitarAcentos(s) {
      return (s || "").normalize("NFD").replace(CARACTERES_DIACRITICOS, "").toLowerCase();
    }

    const REGLAS_CATEGORIA = [

      for (const regla of REGLAS_CATEGORIA) {

    // --- Transcripciones reales publicadas en el feed (podcast:transcript) ---
    function vttOSrtATexto(contenido) {
      return contenido
        .split(/\r?\n/)
        .filter((linea) => {
          const l = linea.trim();
          if (!l) return false;
          if (l === "WEBVTT") return false;
          if (/^NOTE/i.test(l)) return false;
          if (/^\d+$/.test(l)) return false; // números de cue (SRT)
          if (/-->/.test(l)) return false; // línea de tiempos
          return true;
        })
        .join(" ")
        .replace(/<[^>]+>/g, "") // por si trae etiquetas de estilo VTT
        .replace(/\s+/g, " ")
        .trim();
    }

    function jsonTranscriptATexto(jsonText) {
      try {
        const data = JSON.parse(jsonText);
        const segmentos = data.segments || data.results || (Array.isArray(data) ? data : null);
        if (Array.isArray(segmentos)) {
          return segmentos
            .map((seg) => seg.body || seg.text || seg.transcript || (seg.alternatives && seg.alternatives[0] && seg.alternatives[0].transcript) || "")
            .filter(Boolean)
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();
        }
      } catch (e) {}
      return "";
    }

    function elegirMejorTranscriptTag(tags) {
      const prioridad = ["text/plain", "text/vtt", "application/srt", "application/x-subrip", "application/json", "text/html"];
      let mejor = null;
      let mejorRank = Infinity;
      tags.forEach((tag) => {
        const tipo = (tag.getAttribute("type") || "").toLowerCase();
        const rank = prioridad.indexOf(tipo);
        const rankFinal = rank === -1 ? prioridad.length : rank;
        if (rankFinal < mejorRank) { mejorRank = rankFinal; mejor = tag; }
      });
      return mejor;
    }

    async function obtenerTranscripcionDeItem(item) {
      const tags = Array.prototype.slice.call(item.getElementsByTagName("podcast:transcript"));
      if (tags.length === 0) return ""; // el feed no publica transcripciones para este episodio
      const elegido = elegirMejorTranscriptTag(tags);
      const url = elegido && elegido.getAttribute("url");
      if (!url) return "";
      const tipo = (elegido.getAttribute("type") || "").toLowerCase();
      try {
        const contenido = await fetchTextUrl(url);
        if (tipo.indexOf("json") !== -1) return jsonTranscriptATexto(contenido);
        if (tipo.indexOf("vtt") !== -1 || tipo.indexOf("srt") !== -1 || tipo.indexOf("subrip") !== -1) return vttOSrtATexto(contenido);
        if (tipo.indexOf("html") !== -1) return new DOMParser().parseFromString(contenido, "text/html").body.textContent.trim();
        return contenido.trim(); // text/plain u otro formato de texto simple
      } catch (e) {
        return "";
      }
    }

    // Procesa las transcripciones de a varios episodios en paralelo (no de a
    // uno) para que sincronizar un podcast con muchos episodios no tarde
    // demasiado, e informa el progreso mientras tanto.
    async function enriquecerConTranscripciones(episodios, onProgreso) {
      const CONCURRENCIA = 4;
      let indice = 0;
      let completados = 0;
      async function trabajador() {
        while (indice < episodios.length) {
          const i = indice++;
          const ep = episodios[i];
          try {
            ep.transcripcion = await obtenerTranscripcionDeItem(ep._item);
          } catch (e) {
            ep.transcripcion = "";
          }
          delete ep._item;
          completados++;
          if (onProgreso) onProgreso(completados, episodios.length);
        }
      }
      const trabajadores = [];
      for (let i = 0; i < CONCURRENCIA; i++) trabajadores.push(trabajador());
      await Promise.all(trabajadores);
      return episodios;
    }

    // El editor de Spotify for Creators separa "subtítulo" de "descripción"
    // con un párrafo aparte (</p><p>...), sin espacio entre las etiquetas.
    // Si se usa .textContent directamente esa separación se pierde (queda
    // todo pegado); acá se convierten los cierres de <p>/<div> y los <br> a
    // salto de línea ANTES de sacar el resto de las etiquetas, igual que
    // hace strip_html() en scripts/sync_spotify.py.
    function descripcionDeHTML(html) {
      const conSaltos = (html || "")
        .replace(/<\s*\/\s*(p|div)\s*>/gi, "\n")
        .replace(/<\s*br\s*\/?\s*>/gi, "\n");
      const texto = new DOMParser().parseFromString(conSaltos, "text/html").body.textContent;
      return texto
        .replace(/[ \t]*\n[ \t]*/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .replace(/[ \t]+/g, " ")
        .trim();
    }

    function parsearFeedRSS(xmlText) {
      const xml = new DOMParser().parseFromString(xmlText, "text/xml");
      if (xml.getElementsByTagName("parsererror").length) {
        throw new Error("El feed no tiene un formato XML válido.");
      }
      const channel = xml.getElementsByTagName("channel")[0];
      const imagenCanal = channel
        ? (textoDe(channel, "url") || atributoDe(channel, "itunes:image", "href") || "")
        : "";
      const items = Array.prototype.slice.call(xml.getElementsByTagName("item"));
      return items
        .map((item) => {
          const titulo = (textoDe(item, "title") || "Episodio sin título").trim();
          const audioUrl = atributoDe(item, "enclosure", "url") || "";
          const portadaUrl = atributoDe(item, "itunes:image", "href") || imagenCanal || "";
          const pubDateRaw = textoDe(item, "pubDate");
          const fechaObj = pubDateRaw ? new Date(pubDateRaw) : null;
          const fecha = fechaObj && !isNaN(fechaObj.getTime()) ? fechaObj.toISOString().slice(0, 10) : "";
          const descRaw = textoDe(item, "description") || textoDe(item, "itunes:summary") || "";
          const descripcion = descripcionDeHTML(descRaw);
          const categoria = detectarCategoria(titulo, descripcion);
          return { titulo, categoria, audioUrl, portadaUrl, fecha, descripcion, _item: item };
        })
        .filter((ep) => ep.audioUrl); // se descartan entradas sin audio (no son episodios reproducibles)
    }

    // ---------------------------------------------------------------------
    const INSTAGRAM_DEL_RABINO = "https://www.instagram.com/yoelmigdal/";

    function MenuLateral({ abierto, onClose, query, onQueryChange, categoriaActiva, onCategoriaChange, mostrarInstalar, onInstalar, onContacto, onDonar }) {

    // ---------------------------------------------------------------------
    // Datos de cada persona, guardados solo en su dispositivo (sin cuentas):

    const CLAVE_FAVORITOS = "ry_favoritos";
    const CLAVE_PROGRESO = "ry_progreso";
    const MAX_PROGRESOS = 40;
    function leerJSON(clave, defecto) {
      try {
        const v = JSON.parse(localStorage.getItem(clave));
        return v === null || v === undefined ? defecto : v;
      } catch (e) { return defecto; }
    }
    function guardarJSON(clave, valor) {
      try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
    }
    // ---------------------------------------------------------------------
    // SEO en la web: enlaces por tema (?tema=tania), por búsqueda (?q=...) y
    // título / descripción / enlace canónico que cambian según lo que se mira.
    // (Los buscadores y WhatsApp leen además las páginas estáticas s/ y t/.)
    // ---------------------------------------------------------------------
    function slugDe(texto) {
      return String(texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }
    const DESCRIPCION_TEMAS = {
      "Tania": "Clases sobre el Tania (Likutei Amarim), obra fundamental del pensamiento jasídico de Jabad, explicadas capítulo por capítulo por el Rabino Yoel Migdal.",
      "Parashá de la semana": "Shiurim sobre la Parashá semanal de la Torá, con enseñanzas de la Torá y la jasidut.",
      "Conferencias": "Conferencias y charlas del Rabino Yoel Migdal sobre judaísmo, la Torá y la vida cotidiana.",
      "Pensamientos": "Pensamientos breves del Rabino Yoel Migdal para reflexionar sobre la Torá.",
      "Historias Jasídicas": "Historias jasídicas y las enseñanzas que dejan, contadas por el Rabino Yoel Migdal.",
      "Pirkei Avot": "Clases sobre Pirkei Avot (Ética de los Padres), con sus enseñanzas explicadas por el Rabino Yoel Migdal.",
      "Fechas especiales": "Shiurim sobre las fiestas y fechas especiales del calendario judío.",
      "Discursos Jasídicos": "Discursos jasídicos explicados por el Rabino Yoel Migdal.",
      "Historia judía": "Clases de historia del pueblo judío del Rabino Yoel Migdal.",
    };
    const CABECERA_INICIAL = (() => {
      const g = (sel, attr) => { const e = document.querySelector(sel); return e ? e.getAttribute(attr) : ""; };
      return {
        title: document.title,
        description: g('meta[name="description"]', "content"),
        canonical: g('link[rel="canonical"]', "href"),
      };
    })();
    function actualizarCabecera({ titulo, descripcion, canonical }) {
      try {
        document.title = titulo;
        const poner = (sel, attr, valor) => { const e = document.querySelector(sel); if (e) e.setAttribute(attr, valor); };
        poner('meta[name="description"]', "content", descripcion);
        poner('link[rel="canonical"]', "href", canonical);
        poner('meta[property="og:title"]', "content", titulo);
        poner('meta[property="og:description"]', "content", descripcion);
        poner('meta[property="og:url"]', "content", canonical);
        poner('meta[name="twitter:title"]', "content", titulo);
        poner('meta[name="twitter:description"]', "content", descripcion);
      } catch (e) {}
    }
    function categoriaDesdeUrl() {
      try {
        const t = new URLSearchParams(window.location.search).get("tema");
        return t ? CATEGORIAS.find((c) => slugDe(c) === slugDe(t)) || null : null;
      } catch (e) { return null; }
    }
    function busquedaDesdeUrl() {
      try { return (new URLSearchParams(window.location.search).get("q") || "").slice(0, 80); } catch (e) { return ""; }
    }

    // Avance de un shiur empezado: { porcentaje, quedanMin } o null si no lo empezó / ya lo terminó.
    function avanceDe(progresos, shiur) {
      const p = progresos && progresos[String(shiur.id)];
      if (!p || !p.d || p.t < 5 || p.d - p.t < 20) return null;
      return { porcentaje: Math.min(100, (p.t / p.d) * 100), quedanMin: Math.max(1, Math.ceil((p.d - p.t) / 60)) };
    }

    // Aparece con fade-in + slide-up cuando entra en pantalla (una sola vez).
    function Reveal({ children, delay = 0, className = "", as: Tag = "div", ...props }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el || typeof IntersectionObserver === "undefined") { setVisible(true); return; }
        const io = new IntersectionObserver(
          (entradas) => {
            if (entradas.some((e) => e.isIntersecting)) { setVisible(true); io.disconnect(); }
          },
          { threshold: 0.08, rootMargin: "0px 0px -30px 0px" }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return (
        <Tag ref={ref} className={`reveal ${visible ? "is-visible" : ""} ${className}`} style={{ "--d": `${delay}ms` }} {...props}>
          {children}
        </Tag>
      );
    }

    // ---------------------------------------------------------------------
    // Carrusel horizontal: se desliza con el dedo; en pantallas grandes tiene
    // flechas. Cada hijo va envuelto en una celda que se "engancha" al scroll.
    // ---------------------------------------------------------------------
    function Carrusel({ id, titulo, ancho = "w-[92%] sm:w-[440px]", children }) {
      const ref = useRef(null);
      const [pos, setPos] = useState({ inicio: true, fin: false });
      const actualizar = () => {
        const el = ref.current;
        if (!el) return;
        setPos({ inicio: el.scrollLeft < 4, fin: el.scrollLeft + el.clientWidth >= el.scrollWidth - 4 });
      };
      useEffect(() => {
        actualizar();
        window.addEventListener("resize", actualizar);
        return () => window.removeEventListener("resize", actualizar);
      }, [children]);
      const mover = (dir) => {
        const el = ref.current;
        if (el) el.scrollBy({ left: dir * el.clientWidth * 0.85, behavior: "smooth" });
      };
      const sobra = !(pos.inicio && pos.fin);
      const flecha = "w-10 h-10 rounded-full glass text-blue-900 inline-flex items-center justify-center transition-all duration-300 hover:!bg-blue-900 hover:text-white active:scale-90 disabled:opacity-30 disabled:pointer-events-none focus:outline-none focus-visible:ring-2 focus-visible:ring-gold-500";
      return (

    // ---------------------------------------------------------------------
    // Vista detallada (modal de pantalla completa) — incluye transcripción
    // sincronizada con el tiempo real de reproducción del audio (no usa
    // micrófono ni reconocimiento de voz).
    // ---------------------------------------------------------------------
    function ShiurDetailModal({ shiur, onClose, isActive, isPlaying, speed, progreso, actual, duracion, onPlayToggle, onSeek, onSpeedChange, onShare }) {
      const [mostrarTranscripcion, setMostrarTranscripcion] = useState(false);
      // null = todavía no se intentó cargar; [] = se intentó y no hay tiempos
      // reales para este shiur (shiurim viejos aún no procesados); array con
      // datos = tiempos reales por palabra, listos para usar.
      const [tiempos, setTiempos] = useState(null);
      const cajaTextoRef = useRef(null);
      const marcaActualRef = useRef(null);

      const titulo = tituloPrincipalDe(shiur);
      const { subtitulo, descripcion } = separarDescripcion(shiur.descripcion);

      const tieneTranscripcion = !!(shiur.transcripcion && shiur.transcripcion.trim());
      const palabrasPlano = useMemo(
        () => (tieneTranscripcion ? shiur.transcripcion.trim().split(/\s+/) : []),
        [shiur.transcripcion]
      );

      // Carga bajo demanda (solo al abrir la transcripción, una vez por
      // shiur) los tiempos reales por palabra generados por Whisper. Es un
      // archivo aparte de data.json porque puede pesar varios cientos de KB
      // por shiur — cargarlo para los 200+ shiurim en cada visita haría la
      // web lenta. Si el archivo no existe todavía (shiurim a los que
      // todavía no les tocó transcribirse con tiempos), sigue funcionando
      // con la estimación proporcional de siempre como respaldo.
      useEffect(() => {
        if (!mostrarTranscripcion || !tieneTranscripcion) return;
        let cancelado = false;
        setTiempos(null);
        fetch(`./transcripts/${shiur.id}.json`, { cache: "force-cache" })
          .then((r) => (r.ok ? r.json() : null))
          .then((data) => {
            if (!cancelado) setTiempos(data && Array.isArray(data.palabras) ? data.palabras : []);
          })
          .catch(() => { if (!cancelado) setTiempos([]); });
        return () => { cancelado = true; };
      }, [mostrarTranscripcion, tieneTranscripcion, shiur.id]);

      const tieneTiempos = Array.isArray(tiempos) && tiempos.length > 0;
      // Cuando hay tiempos reales, el texto que se muestra sale de ahí mismo
      // (misma fuente que los tiempos), así el resaltado nunca se desalinea
      // por una tokenización distinta a la del texto plano.
      const palabras = tieneTiempos ? tiempos.map((t) => t.w) : palabrasPlano;

      // Palabra actual: con tiempos reales, se busca por búsqueda binaria la
      // última palabra cuyo inicio ya pasó — funciona igual en cualquier
      // velocidad de reproducción, después de pausar, o al saltar hacia
      // adelante/atrás, porque currentTime del audio siempre refleja la
      // posición real (el navegador ya se encarga de eso). Sin tiempos
      // todavía, se usa la estimación proporcional anterior.
      const cantidadVisible = useMemo(() => {
        if (!isActive) return 0;
        if (tieneTiempos) {
          let lo = 0, hi = tiempos.length - 1, resultado = 0;
          while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (tiempos[mid].s <= actual) { resultado = mid + 1; lo = mid + 1; }
            else hi = mid - 1;
          }
          return resultado;
        }
        const progresoTexto = duracion > 0 ? Math.min(1, Math.max(0, actual / duracion)) : 0;
        return Math.round(palabrasPlano.length * progresoTexto);
      }, [isActive, tieneTiempos, tiempos, actual, duracion, palabrasPlano.length]);

      useEffect(() => {
        if (mostrarTranscripcion && marcaActualRef.current && typeof marcaActualRef.current.scrollIntoView === "function") {
          marcaActualRef.current.scrollIntoView({ block: "center" });
        }
      }, [cantidadVisible, mostrarTranscripcion]);

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center" onClick={onClose}>
          <div
            className="bg-white w-full sm:max-w-2xl sm:rounded-lg rounded-t-2xl max-h-[95vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
          >
            {shiur.portadaUrl ? (
              <div className="w-full h-52 sm:h-72 bg-stone-100 flex items-center justify-center overflow-hidden">
                <img src={shiur.portadaUrl} alt={titulo} className="w-full h-full object-contain" loading="lazy" decoding="async" />
              </div>
            ) : (
              <div className="w-full h-16 bg-stone-100" />
            )}

            <div className="p-5 sm:p-8 relative">
              <button
                onClick={onClose}
                className="absolute top-4 right-4 w-9 h-9 flex items-center justify-center text-stone-400 hover:text-stone-700"
                aria-label="Cerrar"
              >
                <IconX size={20} />
              </button>

              <span
                className="inline-block text-[11px] tracking-wide uppercase px-2 py-1 rounded mb-3"
                style={{ color: colorDeCategoria(shiur.categoria).texto, backgroundColor: colorDeCategoria(shiur.categoria).fondo }}
              >
                {shiur.categoria}
              </span>
              <h2 className="font-serif text-2xl text-stone-900 mb-1 pr-8 leading-snug">{titulo}</h2>
              {subtitulo && <h3 className="text-stone-500 text-base italic font-normal mb-1">{subtitulo}</h3>}
              <div className="flex items-center justify-between gap-3 mb-3">
                <p className="text-stone-500 text-sm">{formatFecha(shiur.fecha)}</p>
                <div className="flex items-center gap-1.5 shrink-0">
                  <BotonFavorito shiur={shiur} titulo={titulo} className="!w-9 !h-9 border border-stone-300" />
                  <button
                    onClick={() => onShare(shiur)}
                    className="shrink-0 inline-flex items-center gap-1.5 text-xs sm:text-sm text-stone-600 border border-stone-300 rounded-full px-3 py-2 sm:py-1.5 active:scale-95 hover:text-blue-900 hover:border-blue-900 hover:bg-blue-50 transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-900"
                  >
                    <IconShare size={14} />
                    Compartir
                  </button>
                </div>
              </div>
              {descripcion && <p className="text-stone-700 text-sm leading-relaxed whitespace-pre-line mb-5">{descripcion}</p>}

              {/* Reproductor embebido */}
              <div className="bg-stone-50 border border-stone-200 rounded-lg p-4 mb-4">
                <div className="flex items-center gap-3 mb-3">
                  <button
                    onClick={onPlayToggle}
                    className="shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-stone-900 text-white active:scale-95 transition-transform"
                    aria-label={isActive && isPlaying ? "Pausar" : "Reproducir"}
                  >
                    {isActive && isPlaying ? <IconPause size={20} /> : <IconPlay size={20} />}
                  </button>
                  <div className="flex-1 min-w-0 flex items-center gap-2">
                    <span className="text-[10px] text-stone-400 w-8 text-right shrink-0">{formatTiempo(isActive ? actual : 0)}</span>
                    <input
                      type="range"
                      min={0}
                      max={100}
                      step={0.1}
                      value={isActive && !isNaN(progreso) ? progreso : 0}
                      onChange={(e) => onSeek(Number(e.target.value))}
                      className="w-full accent-stone-900 h-3 sm:h-1.5 cursor-pointer"
                    />
                    <span className="text-[10px] text-stone-400 w-8 shrink-0">{formatTiempo(isActive ? duracion : 0)}</span>
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-[11px] text-stone-500 mr-1">Velocidad:</span>
                  {SPEEDS.map((s) => (
                    <button
                      key={s}
                      onClick={() => onSpeedChange(s)}
                      className={`text-xs px-2.5 py-1.5 rounded border transition-colors ${
                        speed === s ? "bg-stone-900 text-white border-stone-900" : "border-stone-300 text-stone-600 hover:border-stone-500"
                      }`}
                    >
                      {s}x
                    </button>
                  ))}
                </div>
              </div>

              {/* Transcripción sincronizada con el audio del shiur */}
              <div className="mb-6">
                <button
                  onClick={() => setMostrarTranscripcion((v) => !v)}
                  className={`w-full text-sm font-medium px-4 py-3 rounded border transition-colors ${
                    mostrarTranscripcion ? "bg-stone-900 text-white border-stone-900" : "border-stone-300 text-stone-700 hover:bg-stone-50"
                  }`}
                >
                  Transcripción
                </button>

                {mostrarTranscripcion && !tieneTranscripcion && (
                  <p className="text-xs text-stone-400 mt-2 text-center">Todavía no hay transcripción cargada para este shiur.</p>
                )}

                {mostrarTranscripcion && tieneTranscripcion && (
                  <React.Fragment>
                    {!isActive && (
                      <p className="text-xs text-stone-400 mt-2 text-center">Reproducí el audio para que el texto avance solo.</p>
                    )}
                    <div
                      ref={cajaTextoRef}
                      className="mt-3 bg-stone-50 border border-stone-200 rounded-lg p-4 text-sm leading-relaxed max-h-48 overflow-y-auto"
                    >
                      {palabras.map((palabra, i) => (
                        <span
                          key={i}
                          ref={i === cantidadVisible - 1 ? marcaActualRef : null}
                          className={i < cantidadVisible ? "text-stone-900" : "text-stone-300"}
                        >
                          {palabra}{" "}
                        </span>
                      ))}
                    </div>
                  </React.Fragment>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // Reproductor flotante (barra inferior, con audio real)
    // ---------------------------------------------------------------------
    function FloatingPlayer({ current, isPlaying, speed, progreso, actual, duracion, onTogglePlay, onSeek, onSpeedChange, onClose, onOpenDetail }) {
      if (!current) return null;

      const cycleSpeed = () => {
        const idx = SPEEDS.indexOf(speed);
        onSpeedChange(SPEEDS[(idx + 1) % SPEEDS.length]);
      };

      return (
        <div
          className="fixed inset-x-2.5 sm:inset-x-4 mx-auto max-w-3xl glass-dark shadow-float rounded-2xl text-white z-40"
          style={{ bottom: "calc(env(safe-area-inset-bottom) + 10px)" }}
        >
          <div className="px-3 sm:px-4 py-3 flex items-center gap-3 sm:gap-4">
            <button
              onClick={onTogglePlay}
              className="btn-gold shrink-0 w-11 h-11 flex items-center justify-center rounded-full"
              aria-label={isPlaying ? "Pausar" : "Reproducir"}
            >
              {isPlaying ? <IconPause size={18} /> : <IconPlay size={18} />}
            </button>

            <div className="min-w-0 flex-1 cursor-pointer" onClick={onOpenDetail}>
              <p className="text-sm font-medium truncate">{tituloPrincipalDe(current)}</p>
              <div className="flex items-center gap-2 mt-1.5">
                <span className="text-[10px] text-white/60 w-8 text-right shrink-0">{formatTiempo(actual)}</span>
                <input
                  type="range"
                  min={0}
                  max={100}
                  step={0.1}
                  value={isNaN(progreso) ? 0 : progreso}
                  onClick={(e) => e.stopPropagation()}
                  onChange={(e) => onSeek(Number(e.target.value))}
                  className="w-full accent-[#D3A94F] h-3 sm:h-1 cursor-pointer"
                />
                <span className="text-[10px] text-white/60 w-8 shrink-0">{formatTiempo(duracion)}</span>
              </div>
            </div>

            <button

    function CompartirModal({ shiur, onClose }) {

        const alTeclear = (e) => { if (e.key === "Escape") onClose(); };

    // ---------------------------------------------------------------------
    // Panel de Estadísticas (solo administrador). Los datos los junta el
    // contador propio (Cloudflare Worker, ver carpeta contador/) sin cookies y
    // sin guardar IPs, y solo se leen con una clave secreta del servicio: aunque
    // alguien conozca la contraseña del Panel Admin, no puede ver estas cifras.
    // ---------------------------------------------------------------------
    function formatearTiempo(segundos) {
      const s = Math.round(Number(segundos) || 0);
      const h = Math.floor(s / 3600);
      const m = Math.round((s % 3600) / 60);
      if (h >= 1) return `${h} h ${m} min`;
      return `${m} min`;
    }
    const nf = (n) => new Intl.NumberFormat("es-AR").format(Math.round(Number(n) || 0));

    function TarjetaDato({ titulo, valor, detalle }) {
      return (
        <div className="bg-white rounded-2xl p-4 sm:p-5 shadow-card ring-1 ring-blue-900/[0.06]">
          <p className="text-[12px] uppercase tracking-wider text-stone-500">{titulo}</p>

          {detalle && <p className="text-xs text-stone-500 mt-2">{detalle}</p>}
        </div>
      );
    }

    // Gráfico de barras por día (visitas) con los visitantes únicos encima
    function GraficoVisitas({ dias, desde, hasta }) {
      const mapa = {};
      dias.forEach((d) => { mapa[d.dia] = d; });
      const lista = [];
      const fin = new Date(hasta + "T12:00:00");
      for (let d = new Date(desde + "T12:00:00"); d <= fin; d.setDate(d.getDate() + 1)) {
        const clave = d.toISOString().slice(0, 10);
        lista.push(mapa[clave] || { dia: clave, visitas: 0, unicos: 0 });
      }
      const max = Math.max(5, ...lista.map((d) => d.visitas));
      const W = 640, H = 190, base = 160, ancho = W / lista.length;
      const etiqueta = (iso) => iso.slice(8, 10) + "/" + iso.slice(5, 7);
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Visitas por día">
          {[0, 0.5, 1].map((f) => (
            <g key={f}>
              <line x1="0" x2={W} y1={base - f * 140} y2={base - f * 140} stroke="#E3DAC3" strokeWidth="1" />
              <text x="2" y={base - f * 140 - 3} fontSize="10" fill="#746850">{Math.round(max * f)}</text>
            </g>
          ))}
          {lista.map((d, i) => {
            const h = (d.visitas / max) * 140;
            const hu = (d.unicos / max) * 140;
            const x = i * ancho + ancho * 0.15;
            return (
              <g key={d.dia}>
                <rect x={x} y={base - h} width={ancho * 0.7} height={Math.max(h, 0)} rx="2" fill="#1C2B4A" opacity="0.85">
                  <title>{`${etiqueta(d.dia)}: ${d.visitas} visitas, ${d.unicos} únicos`}</title>
                </rect>
                <rect x={x} y={base - hu} width={ancho * 0.7} height={Math.max(hu, 0)} rx="2" fill="#C79A4B" />
              </g>
            );
          })}
          <text x="0" y={H - 6} fontSize="11" fill="#746850">{etiqueta(lista[0].dia)}</text>
          <text x={W / 2} y={H - 6} fontSize="11" fill="#746850" textAnchor="middle">{etiqueta(lista[Math.floor(lista.length / 2)].dia)}</text>
          <text x={W} y={H - 6} fontSize="11" fill="#746850" textAnchor="end">{etiqueta(lista[lista.length - 1].dia)}</text>
        </svg>
      );
    }

    // Lista con barra proporcional
    function ListaConBarras({ filas, vacio }) {
      if (!filas.length) return <p className="text-sm text-stone-500">{vacio}</p>;
      const max = Math.max(...filas.map((f) => f.valor), 1);
      return (
        <ul className="space-y-2.5">
          {filas.map((f, i) => (
            <li key={i}>
              <div className="flex items-baseline justify-between gap-3 text-sm">
                <span className="text-stone-800 line-clamp-1">{f.nombre}</span>
                <span className="text-stone-600 shrink-0 tabular-nums">{f.texto || nf(f.valor)}</span>
              </div>
              <div className="h-1.5 rounded-full bg-stone-100 mt-1 overflow-hidden">
                <div className="h-full rounded-full bg-gradient-to-r from-gold-400 to-gold-600" style={{ width: `${Math.max(3, (f.valor / max) * 100)}%` }} />
              </div>
            </li>
          ))}
        </ul>
      );
    }

    function PanelEstadisticas({ shiurim, onClose }) {
      const CLAVE_SESION = "ry_stats_token";
      const [token, setToken] = useState(() => { try { return sessionStorage.getItem(CLAVE_SESION) || ""; } catch (e) { return ""; } });
      const [entrada, setEntrada] = useState("");
      const [dias, setDias] = useState(30);
      const [datos, setDatos] = useState(null);
      const [estado, setEstado] = useState(token ? "cargando" : "pedir"); // pedir | cargando | ok | clave | error | sin-configurar

      useEffect(() => {
        if (!CONTADOR_URL || !token) return;
        let cancelado = false;
        setEstado("cargando");
        fetch(`${CONTADOR_URL}/estadisticas?dias=${dias}`, { headers: { Authorization: `Bearer ${token}` }, cache: "no-store" })
          .then(async (r) => {
            if (cancelado) return;
            if (r.status === 401) {
              try { sessionStorage.removeItem(CLAVE_SESION); } catch (e) {}
              setToken(""); setEstado("clave"); return;
            }
            if (r.status === 503) { setEstado("sin-configurar"); return; }
            if (!r.ok) throw new Error("http " + r.status);
            setDatos(await r.json());
            setEstado("ok");
          })
          .catch(() => { if (!cancelado) setEstado("error"); });
        return () => { cancelado = true; };
      }, [token, dias]);

      const entrar = (e) => {
        e.preventDefault();
        const t = entrada.trim();
        if (!t) return;
        try { sessionStorage.setItem(CLAVE_SESION, t); } catch (err) {}
        setEntrada("");
        setToken(t);
      };

      const tituloDe = (id) => {
        const s = shiurim.find((x) => String(x.id) === String(id));
        return s ? tituloPrincipalDe(s) : `Shiur ${id}`;
      };
      const nombrePagina = (p) => {
        if (p === "inicio") return "Inicio";
        if (p === "busqueda") return "Búsquedas";
        if (p.startsWith("tema:")) return "Tema: " + p.slice(5);
        if (p.startsWith("shiur:")) return "Shiur: " + tituloDe(p.slice(6));
        return p;
      };
      const nombreOrigen = { encabezado: "Botón Donar (arriba)", menu: "Menú ☰", modal: "Aviso de donación" };

      let resumen = null;
      if (datos) {
        const suma = (k) => datos.dias.reduce((a, d) => a + (Number(d[k]) || 0), 0);
        const visitas = suma("visitas"), mobile = suma("mobile"), desktop = suma("desktop");
        const total = (tipo) => datos.donaciones.filter((d) => d.tipo === tipo).reduce((a, d) => a + d.total, 0);
        const abrir = total("donar_abrir"), clics = total("donar_click");
        const reproducciones = datos.shiurim.reduce((a, s) => a + s.reproducciones, 0);
        const segundos = datos.shiurim.reduce((a, s) => a + s.segundos, 0);
        resumen = { visitas, unicos: suma("unicos"), mobile, desktop, abrir, clics, reproducciones, segundos };
      }

      const caja = "bg-white rounded-2xl p-5 shadow-card ring-1 ring-blue-900/[0.06]";
      return (
        <div className="fixed inset-0 z-[60] bg-stone-50 overflow-y-auto">
          <div className="sticky top-0 z-10 bg-white/90 backdrop-blur-md border-b border-stone-200/70">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
              <h2 className="font-serif text-xl sm:text-2xl font-semibold text-blue-900">Estadísticas</h2>
              <div className="flex items-center gap-2">
                {estado === "ok" && (
                  <div className="flex rounded-full border border-stone-300 overflow-hidden text-sm">
                    {[7, 30, 90].map((n) => (
                      <button key={n} onClick={() => setDias(n)} className={`px-2.5 sm:px-3 py-1.5 whitespace-nowrap ${dias === n ? "bg-blue-900 text-white" : "bg-white text-stone-600 hover:bg-stone-100"}`}>
                        {n} días
                      </button>
                    ))}
                  </div>
                )}
                <button onClick={onClose} className="w-10 h-10 flex items-center justify-center rounded-full text-stone-500 hover:text-stone-900 hover:bg-stone-100" aria-label="Cerrar estadísticas">
                  <IconX size={20} />
                </button>
              </div>
            </div>
          </div>

          <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            {!CONTADOR_URL && (
              <div className={caja}>
                <h3 className="font-serif text-xl text-blue-900 mb-2">Las estadísticas todavía no están activadas</h3>
                <p className="text-sm text-stone-600 leading-relaxed mb-3">
                  Para registrar visitas, escuchas y clics de donación hace falta publicar el contador propio (gratis, en Cloudflare), que no usa cookies ni guarda IPs. Los pasos están en <code>contador/README.md</code>. Cuando esté publicado, se pega su dirección en <code>CONTADOR_URL</code> de <code>index.html</code> y esta pantalla empieza a mostrar los datos.
                </p>
              </div>
            )}

            {CONTADOR_URL && (estado === "pedir" || estado === "clave") && (
              <form onSubmit={entrar} className={`${caja} max-w-md mx-auto`}>
                <div className="w-11 h-11 rounded-full bg-blue-900 text-white flex items-center justify-center mb-4"><IconLock size={18} /></div>
                <h3 className="font-serif text-xl text-blue-900 mb-1">Clave de estadísticas</h3>
                <p className="text-sm text-stone-600 mb-4">Es la clave secreta del contador (no la contraseña del Panel Admin). Se recuerda solo mientras tengas esta pestaña abierta.</p>
                <input
                  type="password"
                  value={entrada}
                  onChange={(e) => setEntrada(e.target.value)}
                  autoFocus
                  autoComplete="off"
                  placeholder="Clave"
                  className="w-full h-12 rounded-xl border border-stone-300 px-4 text-base focus:outline-none focus:border-blue-900 focus:ring-4 focus:ring-gold-500/20"
                />
                {estado === "clave" && <p className="text-sm text-red-600 mt-2">La clave no es correcta.</p>}
                <button type="submit" className="btn-navy w-full h-12 rounded-xl font-medium mt-4">Ver estadísticas</button>
              </form>
            )}

            {CONTADOR_URL && estado === "cargando" && <p className="text-stone-500 text-sm py-20 text-center">Cargando estadísticas…</p>}
            {CONTADOR_URL && estado === "error" && (

              <div className={caja}>
                <p className="text-sm text-stone-700">El contador está publicado pero le falta la clave de estadísticas (<code>ADMIN_TOKEN</code>). Ver <code>contador/README.md</code>.</p>

            {estado === "ok" && resumen && (
              <div className="space-y-6">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                  <TarjetaDato titulo="Visitas" valor={nf(resumen.visitas)} detalle={`últimos ${dias} días`} />
                  <TarjetaDato titulo="Visitantes únicos" valor={nf(resumen.unicos)} detalle="suma de los únicos de cada día" />
                  <TarjetaDato titulo="Reproducciones" valor={nf(resumen.reproducciones)} detalle="escuchas de más de 30 s" />
                  <TarjetaDato titulo="Tiempo escuchado" valor={formatearTiempo(resumen.segundos)} detalle="entre todos los shiurim" />
                </div>

                <div className={caja}>
                  <div className="flex items-baseline justify-between gap-3 mb-3">
                    <h3 className="font-serif text-lg text-blue-900">Visitas por día</h3>
                    <p className="text-xs text-stone-500 flex items-center gap-3">
                      <span className="inline-flex items-center gap-1"><i className="w-2.5 h-2.5 rounded-sm bg-blue-900 inline-block" /> visitas</span>
                      <span className="inline-flex items-center gap-1"><i className="w-2.5 h-2.5 rounded-sm bg-gold-500 inline-block" /> únicos</span>
                    </p>
                  </div>
                  <GraficoVisitas dias={datos.dias} desde={datos.desde} hasta={datos.hasta} />
                </div>

                <div className="grid md:grid-cols-2 gap-4 sm:gap-6">
                  <div className={caja}>
                    <h3 className="font-serif text-lg text-blue-900 mb-4">Dispositivos</h3>
                    {resumen.mobile + resumen.desktop === 0 ? (
                      <p className="text-sm text-stone-500">Todavía no hay visitas en este período.</p>
                    ) : (
                      <>
                        <div className="flex h-4 rounded-full overflow-hidden mb-3">
                          <div className="bg-blue-900" style={{ width: `${(resumen.mobile / (resumen.mobile + resumen.desktop)) * 100}%` }} />
                          <div className="bg-gold-500 flex-1" />
                        </div>
                        <div className="flex justify-between text-sm">
                          <span className="text-stone-800"><i className="inline-block w-2.5 h-2.5 rounded-sm bg-blue-900 mr-1.5" />Celular · <b>{Math.round((resumen.mobile / (resumen.mobile + resumen.desktop)) * 100)}%</b> ({nf(resumen.mobile)})</span>
                          <span className="text-stone-800"><i className="inline-block w-2.5 h-2.5 rounded-sm bg-gold-500 mr-1.5" />Computadora · <b>{Math.round((resumen.desktop / (resumen.mobile + resumen.desktop)) * 100)}%</b> ({nf(resumen.desktop)})</span>
                        </div>
                        <div className="grid grid-cols-2 gap-3 mt-6 pt-5 border-t border-stone-200 text-center">
                          <div>
                            <p className="font-serif text-2xl font-bold text-blue-900">{nf(resumen.visitas / dias)}</p>
                            <p className="text-xs text-stone-500">visitas por día en promedio</p>
                          </div>
                          <div>
                            {(() => {
                              const mejor = datos.dias.reduce((m, d) => (d.visitas > (m ? m.visitas : -1) ? d : m), null);
                              return (
                                <>
                                  <p className="font-serif text-2xl font-bold text-blue-900">{mejor ? nf(mejor.visitas) : 0}</p>
                                  <p className="text-xs text-stone-500">mejor día{mejor ? ` (${mejor.dia.slice(8, 10)}/${mejor.dia.slice(5, 7)})` : ""}</p>
                                </>
                              );
                            })()}
                          </div>
                        </div>
                      </>
                    )}
                  </div>

                  <div className={caja}>
                    <h3 className="font-serif text-lg text-blue-900 mb-4">Donaciones</h3>
                    <div className="grid grid-cols-3 gap-3 mb-4 text-center">
                      <div><p className="font-serif text-2xl font-bold text-blue-900">{nf(resumen.abrir)}</p><p className="text-xs text-stone-500">abrieron el aviso</p></div>
                      <div><p className="font-serif text-2xl font-bold text-blue-900">{nf(resumen.clics)}</p><p className="text-xs text-stone-500">fueron a Mercado Pago</p></div>
                      <div><p className="font-serif text-2xl font-bold text-gold-600">{resumen.abrir ? Math.round((resumen.clics / resumen.abrir) * 100) : 0}%</p><p className="text-xs text-stone-500">de conversión</p></div>
                    </div>
                    <ListaConBarras
                      vacio="Todavía no hubo clics de donación."
                      filas={["encabezado", "menu", "modal"].map((o) => ({
                        nombre: nombreOrigen[o],
                        valor: datos.donaciones.filter((d) => d.origen === o && d.tipo === "donar_click").reduce((a, d) => a + d.total, 0) || datos.donaciones.filter((d) => d.origen === o && d.tipo === "donar_abrir").reduce((a, d) => a + d.total, 0),
                        texto: `${datos.donaciones.filter((d) => d.origen === o && d.tipo === "donar_abrir").reduce((a, d) => a + d.total, 0)} abrieron · ${datos.donaciones.filter((d) => d.origen === o && d.tipo === "donar_click").reduce((a, d) => a + d.total, 0)} clics`,
                      })).filter((f) => f.valor > 0)}
                    />
                    {datos.donaciones.some((d) => d.tipo === "donar_click") && (
                      <>
                        <p className="text-xs uppercase tracking-wider text-stone-500 mt-5 mb-2">Clics por lugar de la web</p>
                        <ListaConBarras
                          vacio=""
                          filas={Object.values(datos.donaciones.filter((d) => d.tipo === "donar_click").reduce((m, d) => {
                            m[d.contexto] = m[d.contexto] || { nombre: nombrePagina(d.contexto), valor: 0 };
                            m[d.contexto].valor += d.total;
                            return m;
                          }, {})).sort((a, b) => b.valor - a.valor).slice(0, 6)}
                        />
                      </>
                    )}
                    <p className="text-[11px] text-stone-400 mt-4 leading-relaxed">El monto lo elige cada persona dentro de Mercado Pago, por eso acá se cuentan clics y desde dónde llegaron, no importes.</p>
                  </div>
                </div>

                <div className="grid md:grid-cols-2 gap-4 sm:gap-6">
                  <div className={caja}>
                    <h3 className="font-serif text-lg text-blue-900 mb-4">Páginas más vistas</h3>
                    <ListaConBarras vacio="Todavía no hay visitas." filas={datos.paginas.slice(0, 10).map((p) => ({ nombre: nombrePagina(p.pagina), valor: p.total }))} />
                  </div>
                  <div className={caja}>
                    <h3 className="font-serif text-lg text-blue-900 mb-4">Shiurim más escuchados</h3>
                    <ListaConBarras
                      vacio="Todavía no hay escuchas."
                      filas={datos.shiurim.filter((s) => s.reproducciones > 0 || s.segundos > 0).slice(0, 10).map((s) => ({
                        nombre: tituloDe(s.id),
                        valor: s.reproducciones || 0.01,
                        texto: `${nf(s.reproducciones)} repr. · ${formatearTiempo(s.segundos)}`,
                      }))}
                    />
                  </div>
                </div>

                <p className="text-xs text-stone-400 text-center pb-6">
                  Del {datos.desde} al {datos.hasta} (hora de Argentina). Sin cookies y sin guardar IPs. No cuentan las visitas ni escuchas hechas como administrador.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // Login del Panel Admin (contraseña simple, sin servicios externos)
    // ---------------------------------------------------------------------
    function AdminLogin({ onSuccess, onCancel }) {
      const [password, setPassword] = useState("");
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === ADMIN_PASSWORD) onSuccess();
        else setError(true);
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-lg max-w-sm w-full p-6 shadow-xl">
            <div className="w-10 h-10 rounded-full bg-stone-900 text-white flex items-center justify-center mb-4">
              <IconLock size={18} />
            </div>
            <h2 className="font-serif text-lg text-stone-900 mb-1">Acceso administrador</h2>
            <p className="text-sm text-stone-500 mb-5">Ingresa la contraseña para continuar.</p>
            <form onSubmit={handleSubmit}>
              <input
                type="password"
                autoFocus
                value={password}
                onChange={(e) => { setPassword(e.target.value); setError(false); }}
                className={`w-full border rounded px-3 py-2.5 text-sm mb-2 focus:outline-none ${
                  error ? "border-red-400" : "border-stone-300 focus:border-blue-900"
                }`}
                placeholder="Contraseña"
              />
              {error && <p className="text-xs text-red-500 mb-3">Contraseña incorrecta.</p>}
              <div className="flex gap-2 mt-4">
                <button type="button" onClick={onCancel} className="flex-1 text-sm border border-stone-300 rounded py-2.5 text-stone-600 hover:bg-stone-50">
                  Cancelar
                </button>
                <button type="submit" className="flex-1 text-sm bg-stone-900 text-white rounded py-2.5 hover:bg-stone-800">
                  Ingresar
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // Panel Admin (crear / editar / eliminar + publicar data.json)
    // ---------------------------------------------------------------------
    const EMPTY_FORM = {
      titulo: "",
      categoria: CATEGORIAS[0],
      fecha: "",
      audioUrl: "",
      portadaUrl: "",
      descripcion: "",
      transcripcion: "",
      reproducciones: 0,
    };

    function AdminPanel({ shiurim, editingShiur, onSave, onEdit, onDelete, onClose, onLogout, onCancelEdit, config, onConfigChange, onExportBackup, onImportBackup, onSyncRss, errorCargaDatos, conteos, onAbrirEstadisticas }) {
      // Con el contador automático activo, las reproducciones son las contadas en
      // la web; si no, el número cargado a mano en cada shiur.
      const reproduccionesDe = (s) => (conteos ? Number(conteos[s.id]) || 0 : Number(s.reproducciones) || 0);
      const [form, setForm] = useState(editingShiur ? { ...EMPTY_FORM, ...editingShiur } : EMPTY_FORM);
      const [sincronizandoRss, setSincronizandoRss] = useState(false);
      const [mensajeRss, setMensajeRss] = useState(null); // { tipo: "ok" | "error" | "info", texto }

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            onImportBackup(data);
          } catch (err) {
            alert("No se pudo leer el archivo. Asegúrate de que sea un backup (data.json) válido.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      const handleSincronizarRss = async () => {
        const url = (config.rssFeedUrl || "").trim();
        if (!url) { setMensajeRss({ tipo: "error", texto: "Pegá primero el link de tu feed RSS." }); return; }
        setSincronizandoRss(true);
        setMensajeRss({ tipo: "info", texto: "Leyendo el feed..." });
        try {
          const xml = await fetchTextUrl(url);
          const episodios = parsearFeedRSS(xml);
          if (episodios.length === 0) {
            setMensajeRss({ tipo: "error", texto: "El feed se leyó bien pero no se encontraron episodios con audio." });
          } else {
            setMensajeRss({ tipo: "info", texto: `Encontrados ${episodios.length} episodios. Buscando transcripciones publicadas en el feed...` });
            await enriquecerConTranscripciones(episodios, (hechos, total) => {
              setMensajeRss({ tipo: "info", texto: `Procesando transcripciones: ${hechos}/${total}...` });
            });
            const { agregados, actualizados, conTranscripcion } = onSyncRss(episodios);
            setMensajeRss({
              tipo: "ok",
              texto: `Listo: se importaron ${episodios.length} episodios del feed (${agregados} nuevo(s), ${actualizados} actualizado(s)). ${conTranscripcion} quedaron con transcripción real importada. No te olvides de "Exportar Backup" para publicarlo.`,
            });
          }
        } catch (err) {
          console.error(err);
          setMensajeRss({ tipo: "error", texto: "No se pudo leer el feed. Revisá que el link sea correcto e intentá de nuevo." });
        } finally {
          setSincronizandoRss(false);
        }
      };

      const totalReproducciones = useMemo(
        () => shiurim.reduce((acc, s) => acc + reproduccionesDe(s), 0),
        [shiurim, conteos]
      );
      const topShiurim = useMemo(
        () => [...shiurim].sort((a, b) => reproduccionesDe(b) - reproduccionesDe(a)).slice(0, 5),
        [shiurim, conteos]
      );
      const maxReproducciones = topShiurim.length ? reproduccionesDe(topShiurim[0]) : 0;

      useEffect(() => {
        setForm(editingShiur ? { ...EMPTY_FORM, ...editingShiur } : EMPTY_FORM);
      }, [editingShiur && editingShiur.id]);

      const update = (field) => (e) => setForm((f) => ({ ...f, [field]: e.target.value }));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.titulo || !form.fecha || !form.audioUrl) return;
        onSave({ ...form, reproducciones: Number(form.reproducciones) || 0 });
        setForm(EMPTY_FORM);
      };

      return (
        <div className="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white rounded-t-2xl sm:rounded-lg max-w-2xl w-full p-5 sm:p-6 relative shadow-xl max-h-[92vh] overflow-y-auto">
            <button onClick={onClose} className="absolute top-4 right-4 text-stone-400 hover:text-stone-700 w-9 h-9 flex items-center justify-center">
              <IconX size={20} />
            </button>

            <div className="flex items-center justify-between pr-10 mb-1">
              <h2 className="font-serif text-xl text-stone-900">Panel Admin</h2>
              <button onClick={onLogout} className="text-xs text-stone-400 hover:text-stone-700 underline shrink-0">
                Cerrar sesión
              </button>
            </div>
            <p className="text-sm text-stone-500 mb-3">{editingShiur ? "Editando shiur existente." : "Cargar un nuevo shiur."}</p>
            <button
              onClick={onAbrirEstadisticas}
              className="btn-navy w-full sm:w-auto inline-flex items-center justify-center gap-2 h-11 px-5 rounded-full text-sm font-medium mb-4"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="20" x2="6" y2="11" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="18" y1="20" x2="18" y2="14" /></svg>
              Ver estadísticas
            </button>

            {errorCargaDatos && (
              <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-4 text-sm text-red-700 flex items-start gap-2">
                <IconAlert size={16} className="shrink-0 mt-0.5" />
                <p className="leading-relaxed">
                  No se pudo leer <code>data.json</code> desde el servidor recién (puede estar caído, no subido, o con un
                  error de formato). Se está mostrando una copia de respaldo guardada en este navegador, que puede estar
                  desactualizada. Revisá que <code>data.json</code> esté en la misma carpeta que <code>index.html</code>{" "}
                  al subirlo a tu hosting, y que sea un JSON válido.
                </p>
              </div>
            )}

            <div className="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-6 text-sm text-stone-700 space-y-2">
              <div className="flex items-start gap-2">
                <IconCheck size={16} className="text-blue-900 shrink-0 mt-0.5" />
                <p className="leading-relaxed">
                  <strong><code>data.json</code> es siempre la versión que ve todo el mundo</strong> — vos incluida/o, en
                  cualquier navegador. Cada vez que se abre la página, se vuelve a leer ese archivo desde cero (sin usar
                  ninguna versión guardada en caché), así que todos ven exactamente lo mismo.
                </p>
              </div>
              <p className="leading-relaxed">
                Por eso, mientras estés agregando o editando shiurim acá, <strong>tocá "Exportar Backup" seguido</strong>{" "}
                (no hace falta esperar a terminar todo). Esa descarga queda segura en tu computadora aunque cierres la
                pestaña. Cuando quieras publicar lo que hiciste para que lo vea cualquier visitante: reemplazá{" "}
                <code>data.json</code> en la carpeta de tu proyecto por el que acabás de exportar, y volvé a subir ese
                archivo a tu hosting (GitHub Pages, Netlify, Vercel, etc.).
              </p>
            </div>

            {/* Importar episodios automáticamente desde el feed RSS de Spotify for Creators */}
            <div className="border border-stone-200 rounded-lg p-4 mb-4">
              <h3 className="font-serif text-base text-stone-900 mb-1">Importar episodios desde Spotify (RSS)</h3>
              <p className="text-xs text-stone-500 mb-4">
                Pegá el link del feed RSS de tu podcast (Spotify for Creators / Anchor) y tocá "Sincronizar Todo": se
                importan automáticamente TODOS los episodios de una sola vez —título, audio, portada, fecha, categoría
                y transcripción, si el feed la publica— sin cargar ni clasificar nada a mano. La categoría se detecta
                sola según palabras clave del título y la descripción de cada episodio. Podés volver a sincronizar
                cuando subas episodios nuevos: los que ya existen se actualizan, nunca se duplican.
              </p>
              <div className="space-y-3">
                <input
                  value={config.rssFeedUrl || ""}
                  onChange={(e) => onConfigChange("rssFeedUrl", e.target.value)}
                  placeholder="https://anchor.fm/s/xxxxxxx/podcast/rss"
                  className="w-full border border-stone-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-blue-900"
                />
                <button
                  type="button"
                  onClick={handleSincronizarRss}
                  disabled={sincronizandoRss}
                  className="w-full flex items-center justify-center gap-1.5 text-sm bg-stone-900 text-white rounded px-4 py-2.5 hover:bg-stone-800 disabled:opacity-50"
                >
                  <IconRefresh size={14} />
                  {sincronizandoRss ? "Sincronizando..." : "Sincronizar Todo"}
                </button>
                {mensajeRss && (
                  <p className={`text-xs ${mensajeRss.tipo === "ok" ? "text-blue-900" : mensajeRss.tipo === "error" ? "text-red-500" : "text-stone-500"}`}>
                    {mensajeRss.texto}
                  </p>
                )}
                <p className="text-xs text-stone-400">
                  Si un episodio no encaja claramente en ninguna categoría por su título, se asigna a "Pensamientos" y
                  después lo podés recategorizar a mano desde "Shiurim existentes". El título que se muestra en la web
                  es siempre el mismo que el título del episodio en Spotify. La descripción que escribas en Spotify se
                  separa sola en subtítulo (primera línea) y descripción (el resto) si dejás un renglón en blanco
                  entre ambos.
                </p>
              </div>
            </div>

            {/* Configuración general: link de Mercado Pago */}
            <div className="border border-stone-200 rounded-lg p-4 mb-4">
              <h3 className="font-serif text-base text-stone-900 mb-1">Configuración general</h3>
              <p className="text-xs text-stone-500 mb-4">
                El link de donación se publica en la web. El email que recibe las consultas no se guarda acá: se
                configura solo en EmailJS, para que nunca quede visible.
              </p>

              <div className="space-y-3">
                <div>
                  <label className="block text-xs uppercase tracking-wide text-stone-500 mb-1">Link de Mercado Pago (donaciones)</label>
                  <input
                    value={config.mercadoPagoLink}
                    onChange={(e) => onConfigChange("mercadoPagoLink", e.target.value)}
                    placeholder="https://mpago.la/..."
                    className="w-full border border-stone-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-blue-900"
                  />
                </div>
              </div>
            </div>

            {/* Backup: un solo archivo con shiurim + configuración */}
            <div className="border border-stone-200 rounded-lg p-4 mb-6">
              <h3 className="font-serif text-base text-stone-900 mb-1">Exportar e integrar data.json</h3>
              <p className="text-xs text-stone-500 mb-4">
                Descarga la lista COMPLETA y actualizada de shiurim (todo lo que ves en "Shiurim existentes" ahí abajo)
                más la configuración, en un solo archivo <code>data.json</code>. Reemplazá el archivo con ese mismo
                nombre dentro de la carpeta de tu proyecto y volvé a subirlo a tu hosting: esa es la única forma
                de que un cambio se vuelva definitivo y visible para cualquier visitante.
              </p>
              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={onExportBackup}
                  className="flex items-center gap-1.5 text-xs bg-stone-900 text-white rounded-full px-4 py-2 hover:bg-stone-800"
                >
                  <IconDownload size={14} />
                  Exportar Backup (data.json)
                </button>
                <label className="flex items-center gap-1.5 text-xs border border-stone-300 rounded-full px-4 py-2 text-stone-600 hover:bg-stone-50 cursor-pointer">
                  <IconUpload size={14} />
                  Restaurar Backup
                  <input type="file" accept="application/json" className="hidden" onChange={handleImportFile} />
                </label>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 mb-8">
              <div>
                <label className="block text-xs uppercase tracking-wide text-stone-500 mb-1">Título (el que trae Spotify/RSS, o el que quieras)</label>
                <input
                  required
                  value={form.titulo}
                  onChange={update("titulo")}
                  className="w-full border border-stone-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-blue-900"
                  placeholder="Ej. Tania cap. 3 — La lucha interior"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs uppercase tracking-wide text-stone-500 mb-1">Categoría</label>
                  <select
                    value={form.categoria}
                    onChange={update("categoria")}
                    className="w-full border border-stone-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-blue-900"
                  >
                    {CATEGORIAS.map((c) => (
                      <option key={c} value={c}>{c}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs uppercase tracking-wide text-stone-500 mb-1">Fecha</label>
                  <input
                    required
                    type="date"
                    value={form.fecha}
                    onChange={update("fecha")}
                    className="w-full border border-stone-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:border-blue-900"
                  />
                </div>
              </div>

              <div>

              <div className="flex gap-2">

                <button

                Total: <span className="font-medium text-stone-900">{totalReproducciones}</span> reproducciones{" "}
                {conteos
                  ? "(contadas en la web: cada una son 30 segundos reales de escucha; una misma persona suma 1 vez cada 6 horas por shiur)"
                  : "(suma de los números que cargaste)"}
              </p>
              {topShiurim.length === 0 ? (
                <p className="text-sm text-stone-400">Todavía no hay datos.</p>

            <div className="border-t border-stone-200 pt-5">
              <h3 className="font-serif text-base text-stone-900 mb-3">Shiurim existentes ({shiurim.length})</h3>

                {shiurim.map((s) => (
                  <div key={s.id} className="flex items-center justify-between gap-2 border border-stone-200 rounded px-3 py-2">
